---
- name: Set APT repository priorities
  when: ansible_facts["distribution"] == 'Debian' or ansible_facts["distribution"] == 'Ubuntu'
  become: true
  block:
    - name: Set Backports priority
      ansible.builtin.copy:
        dest: "/etc/apt/preferences.d/99{{ ansible_facts[\"distribution\"]|lower }}-backports"
        owner: root
        group: root
        mode: '0644'
        content: |
          Package: *
          Pin: release n={{ ansible_facts[\"distribution_release\"]|lower }}-backports
          Pin-Priority: 900
