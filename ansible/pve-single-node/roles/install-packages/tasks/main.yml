---
- name: Install packages
  become: true
  block:
    - name: Install APT packages
      become: true
      when: ansible_facts["distribution"] == 'Debian' or ansible_facts["distribution"] == 'Ubuntu'
      ansible.builtin.package:
        name: "{{ apt_packages }}"
        state: latest
    - name: Install DNF packages
      become: true
      when: ansible_facts["distribution"] == 'Fedora' and ansible_facts["cmdline"].ostree is not defined
      ansible.builtin.package:
        name: "{{ dnf_packages }}"
        state: latest
