---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - resources/cnpg-cluster.yaml
  - resources/notify-push-setup-job.yaml
components:
  - ../../../../../../components/cnpg-backup
helmCharts:
  - name: nextcloud
    repo: oci://ghcr.io/helmforgedev/helm
    version: 2.0.4
    releaseName: nextcloud
    namespace: nextcloud
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - values-override.yaml
    includeCRDs: true
configMapGenerator:
  - name: env-vars
    envs:
      - /tmp/env-vars.env
  - name: nextcloud-public-url
    literals:
      - URL=https://nextcloud.${FQDN_01}
replacements:
  - path: replacements.yaml
patches:
  - path: patches/admin-user-secret.yaml
    target:
      kind: Deployment
      name: nextcloud
  - path: patches/notify-push-setup-config.yaml
    target:
      kind: ConfigMap
      name: nextcloud
  - path: patches/httproute-timeouts.yaml
    target:
      kind: HTTPRoute
      name: nextcloud
  - path: patches/cnpg-backup-destination.yaml
    target:
      kind: ObjectStore
      name: cnpg-backups
