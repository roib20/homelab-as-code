---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    postgresql.cnpg.homelab.towerofkubes.com/barman-server-name: miniflux-postgres
  name: miniflux-postgres
spec:
  bootstrap:
    initdb:
      database: miniflux
      owner: miniflux
  instances: 2
  primaryUpdateMethod: switchover
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  managed:
    services:
      disabledDefaultServices:
        - ro
        - r
  storage:
    size: 10Gi
    storageClass: longhorn-cnpg
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      memory: 512Mi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: cnpg-backups
