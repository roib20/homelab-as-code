---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: miniflux-postgres
spec:
  instances: 2
  primaryUpdateMethod: switchover
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  bootstrap:
    initdb:
      database: miniflux
      owner: miniflux
  managed:
    services:
      disabledDefaultServices:
        - ro
        - r
  storage:
    size: 10Gi
    storageClass: longhorn-cnpg
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      memory: 512Mi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: miniflux-backups
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: miniflux-backups
spec:
  configuration:
    destinationPath: "s3://k8s-backups/cnpg/miniflux"
    s3Credentials:
      accessKeyId:
        name: cnpg-backup-secret
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-backup-secret
        key: AWS_SECRET_ACCESS_KEY
      region:
        name: cnpg-backup-secret
        key: AWS_REGION
    wal:
      compression: gzip
      maxParallel: 2
  retentionPolicy: "30d"
  instanceSidecarConfiguration:
    env:
      - name: AWS_ENDPOINT_URL
        valueFrom:
          secretKeyRef:
            name: cnpg-backup-secret
            key: AWS_ENDPOINT_URL
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: miniflux-postgres-backup
spec:
  schedule: "0 0 4 * * *" # Daily at 04:00 AM
  backupOwnerReference: self
  cluster:
    name: miniflux-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
