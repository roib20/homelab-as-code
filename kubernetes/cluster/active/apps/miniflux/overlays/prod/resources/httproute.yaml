---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: miniflux
  annotations:
    gethomepage.dev/description: Minimalist RSS and feed reader.
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Reading
    gethomepage.dev/icon: miniflux.svg
    gethomepage.dev/name: Miniflux
    gethomepage.dev/pod-selector: "app.kubernetes.io/instance=miniflux"
    gethomepage.dev/widget.headers.X-Auth-Token: "{{HOMEPAGE_VAR_MINIFLUX_KEY}}"
    gethomepage.dev/widget.mappings.0.format: "size"
    gethomepage.dev/widget.mappings.0.label: "Feeds"
    gethomepage.dev/widget.type: "customapi"
    gethomepage.dev/widget.url: "http://miniflux.miniflux.svc.cluster.local:10091/v1/feeds"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: http-gateway-api
      namespace: envoy-gateway-ingress
  hostnames:
    - "feed.${FQDN_01}"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: miniflux
          namespace: miniflux
          port: 10091
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
