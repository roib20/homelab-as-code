---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - resources/cnpg-cluster.yaml
  - resources/httproute.yaml
components:
  - ../../../../../../components/kopiur-volume
  - ../../../../../../components/cnpg-backup
helmCharts:
  - name: miniflux
    repo: oci://oci.trueforge.org/truecharts
    version: 18.11.0
    releaseName: miniflux
    namespace: miniflux
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - values-override.yaml
    includeCRDs: true
configMapGenerator:
  - name: env-vars
    envs:
      - /tmp/env-vars.env
  - name: miniflux-config
    literals:
      - APP_HOST=feed.${FQDN_01}
      - AUTH_HOST=auth.${FQDN_01}
      - BASE_URL=https://feed.${FQDN_01}
      - OIDC_DISCOVERY_ENDPOINT=https://auth.${FQDN_01}/oauth2/openid/$(OAUTH2_CLIENT_ID)
      - OIDC_REDIRECT_URL=https://feed.${FQDN_01}/oauth2/oidc/callback
    options:
      disableNameSuffixHash: true
replacements:
  - path: replacements.yaml
patches:
  - target:
      kind: ObjectStore
      name: cnpg-backups
    patch: |-
      - op: replace
        path: /spec/configuration/destinationPath
        value: s3://k8s-backups/cnpg/miniflux
  - target:
      kind: ScheduledBackup
      name: cnpg-backup
    patch: |-
      - op: replace
        path: /spec/schedule
        value: "0 30 22 * * *"
  - target:
      kind: SnapshotPolicy
      name: kopiur-snapshot-policy
    patch: |-
      - op: replace
        path: /spec/sources/0/pvcSelector/labelSelector/matchLabels/kopiur.home-operations.com~1policy
        value: miniflux
  - target:
      kind: PersistentVolumeClaim
      name: miniflux-config
    patch: |-
      - op: add
        path: /metadata/labels/kopiur.home-operations.com~1policy
        value: miniflux
      - op: add
        path: /spec/dataSourceRef
        value:
          apiGroup: kopiur.home-operations.com
          kind: Restore
          name: kopiur-restore
