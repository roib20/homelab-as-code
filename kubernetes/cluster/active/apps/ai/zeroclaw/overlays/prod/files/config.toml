[gateway]
port = 42617
host = "[::]"
allow_public_bind = true
require_pairing = false
web_dist_dir = "/usr/share/zeroclawlabs/web/dist"

[conversational_ai]
supported_languages = ["en", "he"]

[mcp]
enabled = true
deferred_loading = false

[[mcp.servers]]
name = "gitmcp"
transport = "http"
url = "https://gitmcp.io/docs"

[[mcp.servers]]
name = "zeroclaw"
transport = "http"
url = "https://gitmcp.io/zeroclaw-labs/zeroclaw"

[[mcp.servers]]
name = "ha-mcp"
transport = "http"
url = "http://127.0.0.1:8086/mcp"
tool_timeout_secs = 120

[[mcp.servers]]
name = "tandoor-mcp"
transport = "stdio"
command = "tandoor-recipes-mcp"
env = { TANDOOR_URL = "http://tandoor-recipes.tandoor.svc.cluster.local:10029", TANDOOR_MCP_PROFILE = "full" }

[[mcp.servers]]
name = "yuvomi_mcp"
transport = "http"
url = "http://yuvomi.yuvomi.svc.cluster.local:3000/mcp"
tool_timeout_secs = 120

[[mcp.servers]]
name = "mcp-arr-hd"
transport = "http"
url = "http://127.0.0.1:3000/mcp"
tool_timeout_secs = 120

[[mcp.servers]]
name = "mcp-arr-uhd"
transport = "http"
url = "http://127.0.0.1:43000/mcp"
tool_timeout_secs = 120

[mcp_bundles.mcp]
servers = ["gitmcp", "zeroclaw"]

[mcp_bundles.home-assistant]
servers = ["ha-mcp"]

[mcp_bundles.tandoor]
servers = ["tandoor-mcp"]

[mcp_bundles.yuvomi]
servers = ["yuvomi_mcp"]

[mcp_bundles.arr]
servers = ["mcp-arr-hd", "mcp-arr-uhd"]

[opencode_cli]
enabled = true
