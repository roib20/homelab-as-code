[gateway]
port = 42617
host = "[::]"
allow_public_bind = true
require_pairing = false
web_dist_dir = "/usr/share/zeroclawlabs/web/dist"

[conversational_ai]
supported_languages = ["en", "he"]

[mcp]
enabled = true
deferred_loading = false

[[mcp.servers]]
name = "gitmcp"
transport = "http"
url = "https://gitmcp.io/docs"

[[mcp.servers]]
name = "zeroclaw"
transport = "http"
url = "https://gitmcp.io/zeroclaw-labs/zeroclaw"

[[mcp.servers]]
name = "ha-mcp"
transport = "http"
url = "http://127.0.0.1:8086/mcp"
tool_timeout_secs = 120

[[mcp.servers]]
name = "tandoor-mcp"
transport = "stdio"
command = "tandoor-recipes-mcp"
env = { TANDOOR_URL = "http://tandoor-recipes.tandoor.svc.cluster.local:10029", TANDOOR_MCP_PROFILE = "full" }

[[mcp.servers]]
name = "yuvomi_mcp"
transport = "http"
url = "http://yuvomi.yuvomi.svc.cluster.local:3000/mcp"
tool_timeout_secs = 120

[[mcp.servers]]
name = "trek_mcp"
transport = "http"
url = "http://trek.trek.svc.cluster.local:3000/mcp"
tool_timeout_secs = 120
# TREK runs with FORCE_HTTPS: any request without x-forwarded-proto=https gets
# 301'd to https on :3000, which serves plaintext (TLS ends at the gateway). The
# in-cluster call is the trusted immediate hop (TRUST_PROXY=1), so mark it https.
# The Bearer token is merged into this map from the zeroclaw-trek-mcp secret.
headers = { "X-Forwarded-Proto" = "https" }

[[mcp.servers]]
name = "mcp-arr-hd"
transport = "http"
url = "http://127.0.0.1:3000/mcp"
tool_timeout_secs = 120

[[mcp.servers]]
name = "mcp-arr-uhd"
transport = "http"
url = "http://127.0.0.1:43000/mcp"
tool_timeout_secs = 120

[[mcp.servers]]
name = "garmin"
transport = "stdio"
command = "garmin-mcp"
tool_timeout_secs = 120

[[mcp.servers]]
name = "trvl"
transport = "stdio"
command = "trvl"
args = ["mcp"]
env = { TRVL_NO_TELEMETRY = "1" }
tool_timeout_secs = 120

[mcp_bundles.mcp]
servers = ["gitmcp", "zeroclaw"]

[mcp_bundles.home-assistant]
servers = ["ha-mcp"]

[mcp_bundles.tandoor]
servers = ["tandoor-mcp"]

[mcp_bundles.yuvomi]
servers = ["yuvomi_mcp"]

[mcp_bundles.arr]
servers = ["mcp-arr-hd", "mcp-arr-uhd"]

[mcp_bundles.garmin]
servers = ["garmin"]

[mcp_bundles.travel]
servers = ["trek_mcp", "trvl"]

[opencode_cli]
enabled = true
