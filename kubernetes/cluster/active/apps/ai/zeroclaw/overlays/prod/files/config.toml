schema_version = 3

# OpenAI Codex over a ChatGPT subscription:
# https://docs.zeroclawlabs.ai/master/en/providers/openai-codex-subscription.html
[providers.models.openai.codex]
model = "gpt-5.6-luna"
requires_openai_auth = true
wire_api = "responses"

[providers.transcription.groq.default]
api_key = ""
model = "whisper-large-v3-turbo"

[providers.tts.edge.andrew]
binary_path = "edge-tts"
voice = "en-US-AndrewMultilingualNeural"

[providers.tts.edge.ava]
binary_path = "edge-tts"
voice = "en-US-AvaMultilingualNeural"

[providers.tts.edge.brian]
binary_path = "edge-tts"
voice = "en-US-BrianMultilingualNeural"

[providers.tts.edge.emma]
binary_path = "edge-tts"
voice = "en-US-EmmaMultilingualNeural"

[runtime_profiles.balanced]

[runtime_profiles.local_small]
agentic = true
agentic_timeout_secs = 120
compact_context = true
delegation_timeout_secs = 60
keep_tool_context_turns = 1
max_actions_per_hour = 10
max_context_tokens = 8_000
max_cost_per_day_cents = 100
max_delegation_depth = 1
max_history_messages = 20
max_system_prompt_chars = 4_000
max_tool_iterations = 4
max_tool_result_chars = 4_000
memory_recall_limit = 3
parallel_tools = false
shell_timeout_secs = 30
strict_tool_parsing = true
tool_call_dedup_exempt = []

[runtime_profiles.subscription]
agentic = true
agentic_timeout_secs = 600
compact_context = true
delegation_timeout_secs = 300
keep_tool_context_turns = 4
max_actions_per_hour = 100
max_context_tokens = 32_000
max_cost_per_day_cents = 4_294_967_295
max_delegation_depth = 4
max_history_messages = 100
max_system_prompt_chars = 32_000
max_tool_iterations = 20
max_tool_result_chars = 32_000
memory_recall_limit = 5
parallel_tools = false
shell_timeout_secs = 300
tool_call_dedup_exempt = []

[runtime_profiles.tight]
agentic = false
agentic_timeout_secs = 120
compact_context = true
delegation_timeout_secs = 60
keep_tool_context_turns = 2
max_actions_per_hour = 10
max_context_tokens = 8_000
max_cost_per_day_cents = 100
max_delegation_depth = 1
max_history_messages = 20
max_system_prompt_chars = 4_000
max_tool_iterations = 10
max_tool_result_chars = 8_000
memory_recall_limit = 3
parallel_tools = false
shell_timeout_secs = 30
tool_call_dedup_exempt = []

[runtime_profiles.unbounded]
agentic = true
agentic_timeout_secs = 1_800
compact_context = false
delegation_timeout_secs = 900
keep_tool_context_turns = 8
max_actions_per_hour = 4_294_967_295
max_context_tokens = 128_000
max_cost_per_day_cents = 4_294_967_295
max_delegation_depth = 8
max_history_messages = 200
max_system_prompt_chars = 64_000
max_tool_iterations = 100
max_tool_result_chars = 64_000
memory_recall_limit = 10
parallel_tools = true
shell_timeout_secs = 600
tool_call_dedup_exempt = []

[agents.assistant]
model_provider = "openai.codex"
risk_profile = "assistant"
runtime_profile = "subscription"
mcp_bundles = ["mcp"]
channels = ["telegram.default"]
transcription_provider = "groq.default"
tts_provider = "edge.ava"

[agents.smart-homer]
model_provider = "openai.codex"
risk_profile = "assistant"
runtime_profile = "subscription"
mcp_bundles = ["home-assistant"]
channels = ["telegram.smart_homer"]
transcription_provider = "groq.default"
tts_provider = "edge.andrew"

[agents.chef]
model_provider = "openai.codex"
risk_profile = "chef"
runtime_profile = "subscription"
mcp_bundles = ["tandoor"]
channels = ["telegram.chef"]
transcription_provider = "groq.default"
tts_provider = "edge.ava"

[agents.household]
model_provider = "openai.codex"
risk_profile = "household"
runtime_profile = "subscription"
mcp_bundles = ["yuvomi"]
channels = ["telegram.household"]
transcription_provider = "groq.default"
tts_provider = "edge.emma"

[agents.arr-bot]
model_provider = "openai.codex"
risk_profile = "arr-bot"
runtime_profile = "subscription"
mcp_bundles = ["arr"]
channels = ["telegram.arr_bot"]
transcription_provider = "groq.default"
tts_provider = "edge.andrew"

[agents.coach]
model_provider = "openai.codex"
risk_profile = "coach"
runtime_profile = "subscription"
mcp_bundles = ["garmin"]
channels = ["telegram.coach"]
transcription_provider = "groq.default"
tts_provider = "edge.ava"

[agents.travel-agent]
model_provider = "openai.codex"
risk_profile = "travel-agent"
runtime_profile = "subscription"
mcp_bundles = ["travel"]
channels = ["telegram.travel_agent"]
transcription_provider = "groq.default"
tts_provider = "edge.brian"

[channels]
ack_reactions = true
show_tool_calls = true

[channels.telegram.default]
enabled = true
bot_token = ""
mention_only = true
stream_mode = "off"

[channels.telegram.smart_homer]
enabled = true
bot_token = ""
mention_only = true
stream_mode = "off"

[channels.telegram.chef]
enabled = true
bot_token = ""
mention_only = true
stream_mode = "off"

[channels.telegram.household]
enabled = true
bot_token = ""
mention_only = true
stream_mode = "off"

[channels.telegram.arr_bot]
enabled = true
bot_token = ""
mention_only = true
stream_mode = "off"

[channels.telegram.coach]
enabled = true
bot_token = ""
mention_only = true
stream_mode = "off"

[channels.telegram.travel_agent]
enabled = true
bot_token = ""
mention_only = true
stream_mode = "off"

[peer_groups.telegram_default]
channel = "telegram.default"
agents = ["assistant"]

[peer_groups.telegram_smart_homer]
channel = "telegram.smart_homer"
agents = ["smart-homer"]

[peer_groups.telegram_chef]
channel = "telegram.chef"
agents = ["chef"]

[peer_groups.telegram_household]
channel = "telegram.household"
agents = ["household"]

[peer_groups.telegram_arr_bot]
channel = "telegram.arr_bot"
agents = ["arr-bot"]

[peer_groups.telegram_coach]
channel = "telegram.coach"
agents = ["coach"]

[peer_groups.telegram_travel_agent]
channel = "telegram.travel_agent"
agents = ["travel-agent"]

[transcription]
api_key = ""
enabled = true

[tts]
default_format = "opus"
enabled = true

[multimodal]
allow_remote_fetch = true

[memory]
consolidation_extract_facts = true
search_mode = "bm25"

# Prevent atomic extraction from filling Core with near-duplicates
dedup_on_write = true
dedup_action = "reject"
dedup_jaccard_threshold = 0.80

# Improve which memories are injected into context
rerank_enabled = true

[memory.types]
enabled = true

