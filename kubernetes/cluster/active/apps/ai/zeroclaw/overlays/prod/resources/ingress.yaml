---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zeroclaw
  annotations:
    gethomepage.dev/description: Personal AI assistant.
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: AI
    gethomepage.dev/icon: https://raw.githubusercontent.com/zeroclaw-labs/zeroclaw/master/docs/book/theme/favicon.svg
    gethomepage.dev/name: ZeroClaw
    gethomepage.dev/pod-selector: "app.kubernetes.io/instance=zeroclaw"
    gethomepage.dev/widget.mappings.0.field: "keys"
    gethomepage.dev/widget.mappings.0.format: "size"
    gethomepage.dev/widget.mappings.0.label: "Agents"
    gethomepage.dev/widget.type: "customapi"
    gethomepage.dev/widget.url: "http://zeroclaw.zeroclaw.svc.cluster.local:42617/api/config/map-keys?path=agents"
    tailscale.com/proxy-group: ingress-proxies
spec:
  ingressClassName: tailscale
  rules:
    - host: "zeroclaw.${FQDN_02}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zeroclaw
                port:
                  name: gateway
  tls:
    - hosts:
        - "zeroclaw.${FQDN_02}"
