---
controllers:
  zeroclaw:
    defaultContainerOptionsStrategy: merge
    defaultContainerOptions:
      env:
        TZ: "Asia/Jerusalem"
    annotations:
      configmap.reloader.stakater.com/reload: "zeroclaw-config,zeroclaw-mise"
      secret.reloader.stakater.com/reload: "zeroclaw-auth-codex,zeroclaw-garmin-mcp,zeroclaw-groq-api-key,\
        zeroclaw-ha-mcp,zeroclaw-secret-key,zeroclaw-servarr-secrets,zeroclaw-tandoor-mcp,\
        zeroclaw-telegram-arr-bot,zeroclaw-telegram-chef-bot,zeroclaw-telegram-coach-bot,\
        zeroclaw-telegram-default-bot,zeroclaw-telegram-household-bot,\
        zeroclaw-telegram-smart-homer-bot,zeroclaw-telegram-travel-agent-bot,\
        zeroclaw-trek-mcp,zeroclaw-yuvomi-mcp"
    initContainers:
      bootstrap:
        image:
          repository: ghcr.io/zeroclaw-labs/zeroclaw
          tag: v0.8.3-debian@sha256:287325c1446d14ee8e8ca9ed2f424c718652b811f91bfb6155eca07aba054466
        command:
          - /bin/sh
          - -c
        args:
          - |
            set -eu
            curl --proto '=https' --tlsv1.3 -L https://mise.run | sh
            mise trust "${MISE_GLOBAL_CONFIG_FILE}"
            mise --yes install
            mise --yes prune --tools
            if ! zeroclaw auth status |
              grep -q '^[* ]*openai-codex:[^ ]* kind=OAuth'
            then
              zeroclaw auth login --model-provider openai-codex --import "${HOME}/.codex/auth.json"
            fi
        env:
          HOME: "/zeroclaw-data"
          MISE_GLOBAL_CONFIG_FILE: "$(HOME)/mise.toml"
          PATH: "$(HOME)/.local/bin:$(HOME)/.local/share/mise/shims\
                 :\
                 /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          ZEROCLAW_CONFIG_DIR: "$(HOME)"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            memory: 256Mi
      ha-mcp:
        restartPolicy: Always
        image:
          repository: ghcr.io/homeassistant-ai/ha-mcp
          tag: 7.14.2@sha256:7917b2d385e16e43f45f92fc72a757e5c0aec8d88b3cd69fe64f3b5106cbfe36
        args:
          - ha-mcp-web
        env:
          ENABLE_BETA_FEATURES: "true"
          ENABLE_CODE_MODE: "false"
          ENABLE_YAML_CONFIG_EDITING: "true"
          ENABLE_YAML_EDIT_CONFIRM: "true"
          ENABLE_YAML_PACKAGES_AUTOMATION: "true"
          ENABLE_YAML_PACKAGES_SCENE: "true"
          ENABLE_YAML_PACKAGES_SCRIPT: "true"
          ENVIRONMENT: "production"
          HAMCP_BACKUP_DIR: "/home/mcpuser/.ha-mcp/backups"
          HAMCP_ENABLE_DEV_MODE: "false"
          HAMCP_ENABLE_FILESYSTEM_TOOLS: "true"
          HA_MCP_CONFIG_DIR: "/home/mcpuser/.ha-mcp"
          HA_MCP_DISABLE_SETTINGS_UI: "true"
          MCP_HEALTHZ: "true"
          MCP_HOST: "127.0.0.1"
          MCP_PORT: "8086"
        envFrom:
          - secretRef:
              name: zeroclaw-ha-mcp
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - python
                  - -c
                  - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8086/healthz", timeout=1).close()
              failureThreshold: 60
              periodSeconds: 1
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
      # mcp-arr takes one Sonarr/Radarr per instance, so HD and UHD each get a
      # sidecar. Prowlarr is shared, so both get the same instance.
      mcp-arr-hd:
        restartPolicy: Always
        image: &mcp-arr-image
          repository: ghcr.io/aplaceforallmystuff/mcp-arr
          tag: 1.7.2@sha256:46f2356c2161a8561b6f5680429594cf34aaad0712d1a030f8d662b99556c415
        env:
          MCP_TRANSPORT: "http"
          PORT: "3000"
          PROWLARR_URL: &prowlarr-url "http://prowlarr.servarr.svc.cluster.local:9696"
          PROWLARR_API_KEY: &prowlarr-api-key
            valueFrom:
              secretKeyRef:
                name: &mcp-arr-secret zeroclaw-servarr-secrets
                key: prowlarr_api_key
          RADARR_URL: "http://radarr-hd.servarr.svc.cluster.local:7878"
          RADARR_API_KEY:
            valueFrom:
              secretKeyRef:
                name: *mcp-arr-secret
                key: radarr_hd_api_key
          SONARR_URL: "http://sonarr-hd.servarr.svc.cluster.local:8989"
          SONARR_API_KEY:
            valueFrom:
              secretKeyRef:
                name: *mcp-arr-secret
                key: sonarr_hd_api_key
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              exec:
                command: ["wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
              failureThreshold: 30
              periodSeconds: 1
        securityContext: &mcp-arr-security
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources: &mcp-arr-resources
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            memory: 192Mi
      mcp-arr-uhd:
        restartPolicy: Always
        image: *mcp-arr-image
        env:
          MCP_TRANSPORT: "http"
          PORT: "43000"
          PROWLARR_URL: *prowlarr-url
          PROWLARR_API_KEY: *prowlarr-api-key
          RADARR_URL: "http://radarr-uhd.servarr.svc.cluster.local:7878"
          RADARR_API_KEY:
            valueFrom:
              secretKeyRef:
                name: *mcp-arr-secret
                key: radarr_uhd_api_key
          SONARR_URL: "http://sonarr-uhd.servarr.svc.cluster.local:8989"
          SONARR_API_KEY:
            valueFrom:
              secretKeyRef:
                name: *mcp-arr-secret
                key: sonarr_uhd_api_key
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              exec:
                command: ["wget", "-q", "-O", "/dev/null", "http://127.0.0.1:43000/health"]
              failureThreshold: 30
              periodSeconds: 1
        securityContext: *mcp-arr-security
        resources: *mcp-arr-resources
    containers:
      app:
        envFrom:
          - secretRef:
              name: zeroclaw-garmin-mcp
          - secretRef:
              name: zeroclaw-groq-api-key
          - secretRef:
              name: zeroclaw-tandoor-mcp
          - secretRef:
              name: zeroclaw-telegram-arr-bot
          - secretRef:
              name: zeroclaw-telegram-chef-bot
          - secretRef:
              name: zeroclaw-telegram-coach-bot
          - secretRef:
              name: zeroclaw-telegram-default-bot
          - secretRef:
              name: zeroclaw-telegram-household-bot
          - secretRef:
              name: zeroclaw-telegram-smart-homer-bot
          - secretRef:
              name: zeroclaw-telegram-travel-agent-bot
          - secretRef:
              name: zeroclaw-trek-mcp
          - secretRef:
              name: zeroclaw-yuvomi-mcp
persistence:
  zeroclaw:
    globalMounts: []
    advancedMounts:
      zeroclaw:
        app:
          - path: "/zeroclaw-data"
        bootstrap:
          - path: "/zeroclaw-data"
  config:
    globalMounts: []
    advancedMounts:
      zeroclaw:
        app:
          - path: "/zeroclaw-data/config.toml"
            subPath: "config.toml"
            readOnly: true
        bootstrap:
          - path: "/zeroclaw-data/config.toml"
            subPath: "config.toml"
            readOnly: true
  secret-key:
    globalMounts: []
    defaultMode: 0400
    advancedMounts:
      zeroclaw:
        app:
          - path: "/zeroclaw-data/.secret_key"
            subPath: "secret-key"
            readOnly: true
        bootstrap:
          - path: "/zeroclaw-data/.secret_key"
            subPath: "secret-key"
            readOnly: true
  tmp:
    globalMounts: []
    advancedMounts:
      zeroclaw:
        app:
          - path: "/tmp"
        bootstrap:
          - path: "/tmp"
  codex-auth:
    type: secret
    name: zeroclaw-auth-codex
    advancedMounts:
      zeroclaw:
        bootstrap:
          - path: "/zeroclaw-data/.codex/auth.json"
            subPath: "auth.json"
            readOnly: true
  mise:
    type: configMap
    name: zeroclaw-mise
    advancedMounts:
      zeroclaw:
        app:
          - path: "/zeroclaw-data/mise.toml"
            subPath: "mise.toml"
            readOnly: true
        bootstrap:
          - path: "/zeroclaw-data/mise.toml"
            subPath: "mise.toml"
            readOnly: true
  ha-mcp-data:
    type: emptyDir
    advancedMounts:
      zeroclaw:
        ha-mcp:
          - path: "/home/mcpuser/.ha-mcp"
  ha-mcp-tmp:
    type: emptyDir
    advancedMounts:
      zeroclaw:
        ha-mcp:
          - path: "/tmp"
