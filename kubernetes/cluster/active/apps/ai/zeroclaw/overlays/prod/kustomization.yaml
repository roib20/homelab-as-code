---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: zeroclaw
resources:
  - ../../base
  - external-secrets
  - resources/ingress.yaml
components:
  - ../../../../../../../components/kopiur-volume
helmCharts:
  - name: app-template
    repo: oci://ghcr.io/bjw-s-labs/helm
    version: 5.2.0
    releaseName: zeroclaw
    namespace: zeroclaw
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - values-override.yaml
    includeCRDs: true
configMapGenerator:
  - name: env-vars
    envs:
      - /tmp/env-vars.env
  - name: zeroclaw-config
    behavior: replace
    files:
      - config.toml=files/config.toml
    options:
      disableNameSuffixHash: true
  - name: zeroclaw-mise
    files:
      - mise.toml=files/mise.toml
    options:
      disableNameSuffixHash: true
replacements:
  - path: replacements.yaml
patches:
  - target:
      kind: SnapshotPolicy
      name: kopiur-snapshot-policy
    patch: |-
      - op: replace
        path: /spec/sources/0/pvcSelector/labelSelector/matchLabels/kopiur.home-operations.com~1policy
        value: zeroclaw
  - target:
      kind: PersistentVolumeClaim
      name: zeroclaw
    patch: |-
      - op: add
        path: /metadata/labels/kopiur.home-operations.com~1policy
        value: zeroclaw
      - op: add
        path: /spec/dataSourceRef
        value:
          apiGroup: kopiur.home-operations.com
          kind: Restore
          name: kopiur-restore
