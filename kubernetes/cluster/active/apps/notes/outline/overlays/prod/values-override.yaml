---
global:
  fallbackDefaults:
    storageClass: longhorn
    pvcRetain: false
    pvcSize: 1Gi
cnpg:
  main:
    enabled: false
redis:
  resources:
    limits:
      cpu: null
      memory: 128Mi
    requests:
      cpu: 15m
      memory: 32Mi
workload:
  main:
    podSpec:
      annotations:
        secret.reloader.stakater.com/reload: "outline-app-secrets,outline-kanidm-oauth2-credentials,outline-postgres-app,outline-rediscreds"
      containers:
        main:
          resources:
            limits:
              cpu: null
              memory: 512Mi
            requests:
              cpu: 10m
              memory: 224Mi
          env:
            DATABASE_URL:
              secretKeyRef:
                name: outline-postgres-app
                key: uri
                expandObjectName: false
