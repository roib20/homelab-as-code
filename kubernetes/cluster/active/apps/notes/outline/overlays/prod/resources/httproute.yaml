---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: outline
  annotations:
    gethomepage.dev/description: Collaborative knowledge base.
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Documents & Notes
    gethomepage.dev/icon: outline.svg
    gethomepage.dev/name: Outline
    gethomepage.dev/pod-selector: "app.kubernetes.io/instance=outline"
    gethomepage.dev/widget.headers.Authorization: "Bearer {{HOMEPAGE_VAR_OUTLINE_KEY}}"
    gethomepage.dev/widget.headers.Content-Type: "application/json"
    gethomepage.dev/widget.mappings.0.field: "pagination.total"
    gethomepage.dev/widget.mappings.0.format: "number"
    gethomepage.dev/widget.mappings.0.label: "Documents"
    gethomepage.dev/widget.method: "POST"
    gethomepage.dev/widget.requestBody: '{"limit":1}'
    gethomepage.dev/widget.type: "customapi"
    gethomepage.dev/widget.url: "http://outline.outline.svc.cluster.local:10196/api/documents.list"
    tailscale.com/proxy-group: ingress-proxies
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: http-gateway-api
      namespace: envoy-gateway-ingress
  hostnames:
    - "outline.${FQDN_01}"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: outline
          namespace: outline
          port: 10196
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
