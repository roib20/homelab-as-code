---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - external-secrets
  - resources/cnpg-cluster.yaml
  - resources/httproute.yaml
components:
  - ../../../../../../../components/kopiur-volume
  - ../../../../../../../components/cnpg-backup
helmCharts:
  - name: outline
    repo: oci://oci.trueforge.org/truecharts
    version: 21.23.0
    releaseName: outline
    namespace: outline
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - values-override.yaml
    includeCRDs: true
configMapGenerator:
  - name: env-vars-outline
    envs:
      - /tmp/env-vars.env
    literals:
      - OIDC_ISSUER_PATH=oauth2/openid/outline
replacements:
  - path: replacements.yaml
patches:
  - path: patches/remove-checksum-secrets-deployment.yaml
    target:
      kind: Deployment
      name: outline
  - target:
      kind: ObjectStore
      name: cnpg-backups
    patch: |-
      - op: replace
        path: /spec/configuration/destinationPath
        value: s3://k8s-backups/cnpg/outline
  - target:
      kind: ScheduledBackup
      name: cnpg-backup
    patch: |-
      - op: replace
        path: /spec/schedule
        value: "0 30 23 * * *"
  - target:
      kind: SnapshotPolicy
      name: kopiur-snapshot-policy
    patch: |-
      - op: replace
        path: /spec/sources/0/pvcSelector/labelSelector/matchLabels/kopiur.home-operations.com~1policy
        value: outline
  - target:
      kind: PersistentVolumeClaim
      name: outline-data
    patch: |-
      - op: add
        path: /metadata/labels/kopiur.home-operations.com~1policy
        value: outline
      - op: add
        path: /spec/dataSourceRef
        value:
          apiGroup: kopiur.home-operations.com
          kind: Restore
          name: kopiur-restore
