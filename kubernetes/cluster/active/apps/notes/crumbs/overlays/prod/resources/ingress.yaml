---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crumbs
  annotations:
    gethomepage.dev/description: Self-hosted notes and checklists.
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Documents & Notes
    gethomepage.dev/icon: sh-crumbs-notes.webp
    gethomepage.dev/name: Crumbs
    gethomepage.dev/pod-selector: "app.kubernetes.io/instance=crumbs"
    gethomepage.dev/widget.headers.Authorization: "Bearer {{HOMEPAGE_VAR_CRUMBS_KEY}}"
    gethomepage.dev/widget.mappings.0.format: "size"
    gethomepage.dev/widget.mappings.0.label: "Notes"
    gethomepage.dev/widget.type: "customapi"
    gethomepage.dev/widget.url: "http://crumbs.bretzel.svc.cluster.local:3000/api/notes"
    tailscale.com/proxy-group: ingress-proxies
spec:
  ingressClassName: tailscale
  rules:
    - host: "crumbs.${FQDN_02}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: crumbs
                port:
                  number: 3000
  tls:
    - hosts:
        - "crumbs.${FQDN_02}"
