---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-aio-fulltextsearch
spec:
  template:
    spec:
      containers:
        - name: nextcloud-aio-fulltextsearch
          env:
            - name: ELASTIC_PASSWORD
              value: null
              valueFrom:
                secretKeyRef:
                  name: nextcloud-aio-secrets
                  key: FULLTEXTSEARCH_PASSWORD
