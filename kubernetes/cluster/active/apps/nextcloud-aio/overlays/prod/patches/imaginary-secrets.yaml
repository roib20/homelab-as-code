---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-aio-imaginary
spec:
  template:
    spec:
      containers:
        - name: nextcloud-aio-imaginary
          env:
            - name: IMAGINARY_SECRET
              value: null
              valueFrom:
                secretKeyRef:
                  name: nextcloud-aio-secrets
                  key: IMAGINARY_SECRET
