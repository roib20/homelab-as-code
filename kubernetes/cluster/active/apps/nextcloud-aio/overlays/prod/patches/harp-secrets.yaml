---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-aio-harp
spec:
  template:
    spec:
      containers:
        - name: nextcloud-aio-harp
          env:
            - name: HP_SHARED_KEY
              value: null
              valueFrom:
                secretKeyRef:
                  name: nextcloud-aio-secrets
                  key: HP_SHARED_KEY
