---
# yaml-language-server: $schema=https://www.schemastore.org/json-patch.json
- op: test
  path: "/spec/template/spec/containers/0/name"
  value: nextcloud-aio-harp
- op: test
  path: "/spec/template/spec/containers/0/env/6/name"
  value: HP_SHARED_KEY
- op: replace
  path: "/spec/template/spec/containers/0/env/6"
  value:
    name: HP_SHARED_KEY
    valueFrom:
      secretKeyRef:
        name: nextcloud-aio-secrets
        key: HP_SHARED_KEY
