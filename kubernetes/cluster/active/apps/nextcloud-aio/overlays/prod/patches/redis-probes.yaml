---
# yaml-language-server: $schema=https://www.schemastore.org/json-patch.json
- op: test
  path: "/spec/template/spec/containers/0/name"
  value: nextcloud-aio-redis
# Use redis-cli -e so authentication and command errors fail readiness and liveness checks.
- op: replace
  path: "/spec/template/spec/containers/0/readinessProbe/exec/command"
  value:
    - "/bin/sh"
    - -ec
    - REDISCLI_AUTH="$REDIS_HOST_PASSWORD" redis-cli -e PING
- op: copy
  from: "/spec/template/spec/containers/0/readinessProbe/exec/command"
  path: "/spec/template/spec/containers/0/livenessProbe/exec/command"
