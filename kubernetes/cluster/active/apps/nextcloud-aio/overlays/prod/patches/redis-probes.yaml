---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-aio-redis
spec:
  template:
    spec:
      containers:
        - name: nextcloud-aio-redis
          # Use redis-cli -e so authentication and command errors fail readiness and liveness checks.
          readinessProbe:
            exec:
              command: &redis-ping
                - "/bin/sh"
                - -ec
                - REDISCLI_AUTH="$REDIS_HOST_PASSWORD" redis-cli -e PING
          livenessProbe:
            exec:
              command: *redis-ping
