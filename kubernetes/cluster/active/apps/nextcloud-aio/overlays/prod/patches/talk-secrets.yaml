---
# yaml-language-server: $schema=https://www.schemastore.org/json-patch.json
- op: test
  path: "/spec/template/spec/containers/0/name"
  value: nextcloud-aio-talk
- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: TURN_DOMAIN
    value: turn.${FQDN_01}
- op: test
  path: "/spec/template/spec/containers/0/env/3/name"
  value: INTERNAL_SECRET
- op: replace
  path: "/spec/template/spec/containers/0/env/3"
  value:
    name: INTERNAL_SECRET
    valueFrom:
      secretKeyRef:
        name: nextcloud-aio-secrets
        key: TALK_INTERNAL_SECRET
- op: test
  path: "/spec/template/spec/containers/0/env/5/name"
  value: SIGNALING_SECRET
- op: replace
  path: "/spec/template/spec/containers/0/env/5"
  value:
    name: SIGNALING_SECRET
    valueFrom:
      secretKeyRef:
        name: nextcloud-aio-secrets
        key: SIGNALING_SECRET
- op: test
  path: "/spec/template/spec/containers/0/env/8/name"
  value: TURN_SECRET
- op: replace
  path: "/spec/template/spec/containers/0/env/8"
  value:
    name: TURN_SECRET
    valueFrom:
      secretKeyRef:
        name: nextcloud-aio-secrets
        key: TURN_SECRET
