---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-aio-talk
spec:
  template:
    spec:
      containers:
        - name: nextcloud-aio-talk
          env:
            - name: TURN_DOMAIN
              value: turn.${FQDN_01}
            - name: INTERNAL_SECRET
              value: null
              valueFrom:
                secretKeyRef:
                  name: nextcloud-aio-secrets
                  key: TALK_INTERNAL_SECRET
            - name: SIGNALING_SECRET
              value: null
              valueFrom:
                secretKeyRef:
                  name: nextcloud-aio-secrets
                  key: SIGNALING_SECRET
            - name: TURN_SECRET
              value: null
              valueFrom:
                secretKeyRef:
                  name: nextcloud-aio-secrets
                  key: TURN_SECRET
