---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-aio-database
spec:
  template:
    spec:
      containers:
        - name: nextcloud-aio-database
          env:
            - name: POSTGRES_PASSWORD
              value: null
              valueFrom:
                secretKeyRef:
                  name: nextcloud-aio-secrets
                  key: DATABASE_PASSWORD
