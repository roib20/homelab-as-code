---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-aio-eurooffice
spec:
  template:
    spec:
      containers:
        - name: nextcloud-aio-eurooffice
          env:
            - name: JWT_SECRET
              value: null
              valueFrom:
                secretKeyRef:
                  name: nextcloud-aio-secrets
                  key: EUROOFFICE_SECRET
