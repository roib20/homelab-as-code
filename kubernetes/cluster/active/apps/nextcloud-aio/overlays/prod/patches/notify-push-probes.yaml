---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-aio-notify-push
spec:
  template:
    spec:
      containers:
        - name: nextcloud-aio-notify-push
          # Allow an hour for initial Nextcloud installation before notify-push starts its listener and liveness checks begin.
          startupProbe:
            tcpSocket:
              port: 7867
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 360
          livenessProbe:
            exec: null
            tcpSocket:
              port: 7867
          readinessProbe:
            exec:
              command:
                - "/bin/sh"
                - -ec
                - |
                  nc -z -w 2 "$NEXTCLOUD_HOST" 9001
                  nc -z -w 2 127.0.0.1 7867
