---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-aio-redis
spec:
  template:
    spec:
      containers:
        - name: nextcloud-aio-redis
          env:
            - name: REDIS_HOST_PASSWORD
              value: null
              valueFrom:
                secretKeyRef:
                  name: nextcloud-aio-secrets
                  key: REDIS_PASSWORD
