---
# yaml-language-server: $schema=https://www.schemastore.org/json-patch.json
- op: test
  path: "/spec/template/spec/containers/0/name"
  value: nextcloud-aio-talk-recording
- op: test
  path: "/spec/template/spec/containers/0/env/1/name"
  value: INTERNAL_SECRET
- op: replace
  path: "/spec/template/spec/containers/0/env/1"
  value:
    name: INTERNAL_SECRET
    valueFrom:
      secretKeyRef:
        name: nextcloud-aio-secrets
        key: TALK_INTERNAL_SECRET
- op: test
  path: "/spec/template/spec/containers/0/env/3/name"
  value: RECORDING_SECRET
- op: replace
  path: "/spec/template/spec/containers/0/env/3"
  value:
    name: RECORDING_SECRET
    valueFrom:
      secretKeyRef:
        name: nextcloud-aio-secrets
        key: RECORDING_SECRET
