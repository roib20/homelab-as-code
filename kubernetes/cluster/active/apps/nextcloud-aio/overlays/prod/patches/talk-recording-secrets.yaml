---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-aio-talk-recording
spec:
  template:
    spec:
      containers:
        - name: nextcloud-aio-talk-recording
          env:
            - name: INTERNAL_SECRET
              value: null
              valueFrom:
                secretKeyRef:
                  name: nextcloud-aio-secrets
                  key: TALK_INTERNAL_SECRET
            - name: RECORDING_SECRET
              value: null
              valueFrom:
                secretKeyRef:
                  name: nextcloud-aio-secrets
                  key: RECORDING_SECRET
