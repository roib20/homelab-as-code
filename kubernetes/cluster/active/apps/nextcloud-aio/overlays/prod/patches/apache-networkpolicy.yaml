---
# yaml-language-server: $schema=https://www.schemastore.org/json-patch.json
- op: replace
  path: "/spec/ingress"
  value:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-ingress
      ports:
        - protocol: TCP
          port: 11000
# Keep AIO callbacks and shared-volume traffic allowed by the chart's separate namespace-wide policy.
