---
# yaml-language-server: $schema=https://www.schemastore.org/json-patch.json
- op: replace
  path: "/spec/ingress"
  value:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-ingress
      ports:
        - protocol: TCP
          port: 11000
# The upstream namespace policy separately permits AIO callbacks and shared-volume services.
