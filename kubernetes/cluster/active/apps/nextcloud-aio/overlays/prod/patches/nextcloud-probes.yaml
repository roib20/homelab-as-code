---
# yaml-language-server: $schema=https://www.schemastore.org/json-patch.json
# First install runs db migrations for several minutes; without a startup probe the
# liveness probe kills the container mid-install and the install never completes.
- op: test
  path: /spec/template/spec/containers/0/name
  value: nextcloud-aio-nextcloud
- op: add
  path: /spec/template/spec/containers/0/startupProbe
  value:
    exec:
      command:
        - /healthcheck.sh
    periodSeconds: 10
    timeoutSeconds: 30
    failureThreshold: 360
