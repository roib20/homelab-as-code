---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-aio-nextcloud
spec:
  template:
    spec:
      containers:
        - name: nextcloud-aio-nextcloud
          # Allow an hour for initial Nextcloud installation before PHP-FPM starts and liveness checks begin.
          startupProbe:
            tcpSocket:
              port: 9000
            periodSeconds: 10
            timeoutSeconds: 30
            failureThreshold: 360
          livenessProbe:
            exec: null
            tcpSocket:
              port: 9000
          readinessProbe:
            exec:
              command:
                - "/bin/sh"
                - -ec
                - |
                  nc -z -w 2 127.0.0.1 9000
                  nc -z -w 2 "$POSTGRES_HOST" "$POSTGRES_PORT"
                  nc -z -w 2 "$REDIS_HOST" "$REDIS_PORT"
