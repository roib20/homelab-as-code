---
# yaml-language-server: $schema=https://www.schemastore.org/json-patch.json
- op: test
  path: "/spec/template/spec/containers/0/name"
  value: nextcloud-aio-whiteboard
- op: test
  path: "/spec/template/spec/containers/0/env/2/name"
  value: JWT_SECRET_KEY
- op: replace
  path: "/spec/template/spec/containers/0/env/2"
  value:
    name: JWT_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: nextcloud-aio-secrets
        key: WHITEBOARD_SECRET
- op: test
  path: "/spec/template/spec/containers/0/env/5/name"
  value: REDIS_HOST_PASSWORD
- op: replace
  path: "/spec/template/spec/containers/0/env/5"
  value:
    name: REDIS_HOST_PASSWORD
    valueFrom:
      secretKeyRef:
        name: nextcloud-aio-secrets
        key: REDIS_PASSWORD
