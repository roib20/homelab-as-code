---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-aio-whiteboard
spec:
  template:
    spec:
      containers:
        - name: nextcloud-aio-whiteboard
          env:
            - name: JWT_SECRET_KEY
              value: null
              valueFrom:
                secretKeyRef:
                  name: nextcloud-aio-secrets
                  key: WHITEBOARD_SECRET
            - name: REDIS_HOST_PASSWORD
              value: null
              valueFrom:
                secretKeyRef:
                  name: nextcloud-aio-secrets
                  key: REDIS_PASSWORD
