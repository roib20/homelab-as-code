---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-aio-apache
spec:
  template:
    spec:
      containers:
        - name: nextcloud-aio-apache
          # Allow an hour for initial Nextcloud installation before Apache starts its listeners and liveness checks begin.
          startupProbe:
            exec:
              command:
                - "/bin/sh"
                - -ec
                - |
                  nc -z -w 2 127.0.0.1 8000
                  nc -z -w 2 127.0.0.1 "$APACHE_PORT"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 360
          livenessProbe:
            exec:
              command:
                - "/bin/sh"
                - -ec
                - |
                  nc -z -w 2 127.0.0.1 8000
                  nc -z -w 2 127.0.0.1 "$APACHE_PORT"
          readinessProbe:
            exec:
              command:
                - "/bin/sh"
                - -ec
                - |
                  nc -z -w 2 "$NEXTCLOUD_HOST" 9000
                  nc -z -w 2 127.0.0.1 8000
                  nc -z -w 2 127.0.0.1 "$APACHE_PORT"
