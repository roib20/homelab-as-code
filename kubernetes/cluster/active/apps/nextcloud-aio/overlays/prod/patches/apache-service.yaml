---
# yaml-language-server: $schema=https://www.schemastore.org/json-patch.json
- op: replace
  path: "/spec/type"
  value: ClusterIP
# Remove the chart's externalTrafficPolicy; it is invalid for a ClusterIP Service without external IPs.
- op: remove
  path: "/spec/externalTrafficPolicy"
- op: replace
  path: "/spec/ports"
  value:
    - name: http
      port: 11000
      targetPort: 11000
      protocol: TCP
      appProtocol: http
    # Expose Caddy's Collabora callback listener; the chart omits this Service port.
    - name: wopi
      port: 23973
      targetPort: 23973
      protocol: TCP
      appProtocol: http
