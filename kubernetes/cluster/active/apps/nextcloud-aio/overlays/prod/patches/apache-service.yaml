---
# yaml-language-server: $schema=https://www.schemastore.org/json-patch.json
- op: replace
  path: /spec/type
  value: ClusterIP
# The chart ships a LoadBalancer service with Local policy; remove it so ClusterIP validates.
- op: remove
  path: /spec/externalTrafficPolicy
- op: replace
  path: /spec/ports
  value:
    - name: http
      port: 11000
      targetPort: 11000
      protocol: TCP
      appProtocol: http
    # Upstream Caddy listens here for Collabora callbacks, but the chart omits the Service port.
    - name: wopi
      port: 23973
      targetPort: 23973
      protocol: TCP
      appProtocol: http
