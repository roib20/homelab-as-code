---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-aio-apache
spec:
  type: ClusterIP
  # Remove the chart's externalTrafficPolicy; it is invalid for a ClusterIP Service without external IPs.
  externalTrafficPolicy: null
  ports:
    - $patch: replace
    - name: http
      port: 11000
      targetPort: 11000
      protocol: TCP
      appProtocol: http
    # Expose Caddy's Collabora callback listener; the chart omits this Service port.
    - name: wopi
      port: 23973
      targetPort: 23973
      protocol: TCP
      appProtocol: http
