---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-aio-fulltextsearch
spec:
  template:
    spec:
      containers:
        - name: nextcloud-aio-fulltextsearch
          startupProbe:
            tcpSocket:
              port: 9200
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          # Check local HTTP responsiveness for liveness; leave search-data availability to readiness checks.
          livenessProbe:
            exec:
              command:
                - "/bin/sh"
                - -ec
                - curl -fs --max-time 4 -u "elastic:$ELASTIC_PASSWORD" "http://127.0.0.1:9200/" >"/dev/null"
