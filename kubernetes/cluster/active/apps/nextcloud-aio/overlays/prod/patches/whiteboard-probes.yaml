---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-aio-whiteboard
spec:
  template:
    spec:
      containers:
        - name: nextcloud-aio-whiteboard
          startupProbe:
            tcpSocket:
              port: 3002
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec: null
            tcpSocket:
              port: 3002
          readinessProbe:
            exec:
              command:
                - "/bin/sh"
                - -ec
                - |
                  nc -z -w 2 "$REDIS_HOST" "$REDIS_PORT"
                  nc -z -w 2 127.0.0.1 3002
