---
# yaml-language-server: $schema=https://www.schemastore.org/json-patch.json
- op: test
  path: "/spec/template/spec/containers/0/name"
  value: nextcloud-aio-whiteboard
- op: add
  path: "/spec/template/spec/containers/0/startupProbe"
  value:
    tcpSocket:
      port: 3002
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
- op: remove
  path: "/spec/template/spec/containers/0/livenessProbe/exec"
- op: add
  path: "/spec/template/spec/containers/0/livenessProbe/tcpSocket"
  value:
    port: 3002
- op: replace
  path: "/spec/template/spec/containers/0/readinessProbe/exec/command"
  value:
    - "/bin/sh"
    - -ec
    - |
      nc -z -w 2 "$REDIS_HOST" "$REDIS_PORT"
      nc -z -w 2 127.0.0.1 3002
