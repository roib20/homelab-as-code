---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-aio-nextcloud-trusted-cacerts
spec:
  # Use ReadWriteMany so Nextcloud and Talk can mount the certificate volume on different nodes without attachment conflicts.
  # Longhorn shares the volume through a share manager; both applications mount it read-only.
  accessModes:
    - ReadWriteMany
