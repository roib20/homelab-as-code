---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-aio-nextcloud
spec:
  template:
    spec:
      containers:
        - name: nextcloud-aio-nextcloud
          env:
            - name: ADMIN_PASSWORD
              value: null
              valueFrom:
                secretKeyRef:
                  name: nextcloud-aio-secrets
                  key: NEXTCLOUD_PASSWORD
            - name: ADMIN_USER
              value: null
              valueFrom:
                secretKeyRef:
                  name: nextcloud-aio-secrets
                  key: NEXTCLOUD_USERNAME
            - name: EUROOFFICE_SECRET
              value: null
              valueFrom:
                secretKeyRef:
                  name: nextcloud-aio-secrets
                  key: EUROOFFICE_SECRET
            - name: FULLTEXTSEARCH_PASSWORD
              value: null
              valueFrom:
                secretKeyRef:
                  name: nextcloud-aio-secrets
                  key: FULLTEXTSEARCH_PASSWORD
            # AIO drops privileges without changing HOME; libpq must not look for client certificates under /root.
            - name: HOME
              value: "/home/www-data"
            - name: HP_SHARED_KEY
              value: null
              valueFrom:
                secretKeyRef:
                  name: nextcloud-aio-secrets
                  key: HP_SHARED_KEY
            - name: IMAGINARY_SECRET
              value: null
              valueFrom:
                secretKeyRef:
                  name: nextcloud-aio-secrets
                  key: IMAGINARY_SECRET
            - name: ONLYOFFICE_SECRET
              value: null
              valueFrom:
                secretKeyRef:
                  name: nextcloud-aio-secrets
                  key: ONLYOFFICE_SECRET
            - name: PGSSLROOTCERT
              value: "/postgres-ca/ca.crt"
            - name: PGSSLMODE
              value: verify-full
            - name: POSTGRES_HOST
              value: nextcloud-aio-postgres-rw
            - name: POSTGRES_PASSWORD
              value: null
              valueFrom:
                secretKeyRef:
                  name: nextcloud-aio-postgres-app
                  key: password
            - name: RECORDING_SECRET
              value: null
              valueFrom:
                secretKeyRef:
                  name: nextcloud-aio-secrets
                  key: RECORDING_SECRET
            - name: REDIS_HOST_PASSWORD
              value: null
              valueFrom:
                secretKeyRef:
                  name: nextcloud-aio-secrets
                  key: REDIS_PASSWORD
            - name: SERVERINFO_TOKEN
              value: null
              valueFrom:
                secretKeyRef:
                  name: nextcloud-aio-secrets
                  key: SERVERINFO_TOKEN
            - name: SIGNALING_SECRET
              value: null
              valueFrom:
                secretKeyRef:
                  name: nextcloud-aio-secrets
                  key: SIGNALING_SECRET
            - name: SMTP_PASSWORD
              value: null
              valueFrom:
                secretKeyRef:
                  name: nextcloud-aio-secrets
                  key: SMTP_PASSWORD
            - name: SUBSCRIPTION_KEY
              value: null
              valueFrom:
                secretKeyRef:
                  name: nextcloud-aio-secrets
                  key: SUBSCRIPTION_KEY
            - name: TURN_DOMAIN
              value: turn.${FQDN_01}
            - name: TURN_SECRET
              value: null
              valueFrom:
                secretKeyRef:
                  name: nextcloud-aio-secrets
                  key: TURN_SECRET
            - name: WHITEBOARD_SECRET
              value: null
              valueFrom:
                secretKeyRef:
                  name: nextcloud-aio-secrets
                  key: WHITEBOARD_SECRET
          volumeMounts:
            - name: postgres-ca
              mountPath: "/postgres-ca"
              readOnly: true
      volumes:
        - name: postgres-ca
          secret:
            secretName: nextcloud-aio-postgres-ca
            items:
              - key: ca.crt
                path: "ca.crt"
