---
# yaml-language-server: $schema=https://www.schemastore.org/json-patch.json
- op: test
  path: "/spec/template/spec/containers/0/name"
  value: nextcloud-aio-nextcloud
- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: TURN_DOMAIN
    value: turn.${FQDN_01}
- op: test
  path: "/spec/template/spec/containers/0/env/5/name"
  value: SMTP_PASSWORD
- op: replace
  path: "/spec/template/spec/containers/0/env/5"
  value:
    name: SMTP_PASSWORD
    valueFrom:
      secretKeyRef:
        name: nextcloud-aio-secrets
        key: SMTP_PASSWORD
- op: test
  path: "/spec/template/spec/containers/0/env/8/name"
  value: SUBSCRIPTION_KEY
- op: replace
  path: "/spec/template/spec/containers/0/env/8"
  value:
    name: SUBSCRIPTION_KEY
    valueFrom:
      secretKeyRef:
        name: nextcloud-aio-secrets
        key: SUBSCRIPTION_KEY
- op: test
  path: "/spec/template/spec/containers/0/env/12/name"
  value: SERVERINFO_TOKEN
- op: replace
  path: "/spec/template/spec/containers/0/env/12"
  value:
    name: SERVERINFO_TOKEN
    valueFrom:
      secretKeyRef:
        name: nextcloud-aio-secrets
        key: SERVERINFO_TOKEN
- op: test
  path: "/spec/template/spec/containers/0/env/18/name"
  value: ADMIN_PASSWORD
- op: replace
  path: "/spec/template/spec/containers/0/env/18"
  value:
    name: ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: nextcloud-aio-secrets
        key: NEXTCLOUD_PASSWORD
- op: test
  path: "/spec/template/spec/containers/0/env/29/name"
  value: EUROOFFICE_SECRET
- op: replace
  path: "/spec/template/spec/containers/0/env/29"
  value:
    name: EUROOFFICE_SECRET
    valueFrom:
      secretKeyRef:
        name: nextcloud-aio-secrets
        key: EUROOFFICE_SECRET
- op: test
  path: "/spec/template/spec/containers/0/env/33/name"
  value: FULLTEXTSEARCH_PASSWORD
- op: replace
  path: "/spec/template/spec/containers/0/env/33"
  value:
    name: FULLTEXTSEARCH_PASSWORD
    valueFrom:
      secretKeyRef:
        name: nextcloud-aio-secrets
        key: FULLTEXTSEARCH_PASSWORD
- op: test
  path: "/spec/template/spec/containers/0/env/38/name"
  value: HP_SHARED_KEY
- op: replace
  path: "/spec/template/spec/containers/0/env/38"
  value:
    name: HP_SHARED_KEY
    valueFrom:
      secretKeyRef:
        name: nextcloud-aio-secrets
        key: HP_SHARED_KEY
- op: test
  path: "/spec/template/spec/containers/0/env/41/name"
  value: IMAGINARY_SECRET
- op: replace
  path: "/spec/template/spec/containers/0/env/41"
  value:
    name: IMAGINARY_SECRET
    valueFrom:
      secretKeyRef:
        name: nextcloud-aio-secrets
        key: IMAGINARY_SECRET
- op: test
  path: "/spec/template/spec/containers/0/env/48/name"
  value: ONLYOFFICE_SECRET
- op: replace
  path: "/spec/template/spec/containers/0/env/48"
  value:
    name: ONLYOFFICE_SECRET
    valueFrom:
      secretKeyRef:
        name: nextcloud-aio-secrets
        key: ONLYOFFICE_SECRET
- op: test
  path: "/spec/template/spec/containers/0/env/54/name"
  value: POSTGRES_HOST
- op: replace
  path: "/spec/template/spec/containers/0/env/54"
  value:
    name: POSTGRES_HOST
    value: nextcloud-aio-postgres-rw
- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: PGSSLMODE
    value: verify-full
- op: add
  path: "/spec/template/spec/containers/0/env/-"
  value:
    name: PGSSLROOTCERT
    value: "/postgres-ca/ca.crt"
- op: test
  path: "/spec/template/spec/containers/0/env/55/name"
  value: POSTGRES_PASSWORD
- op: replace
  path: "/spec/template/spec/containers/0/env/55"
  value:
    name: POSTGRES_PASSWORD
    valueFrom:
      secretKeyRef:
        name: nextcloud-aio-postgres-app
        key: password
- op: test
  path: "/spec/template/spec/containers/0/env/58/name"
  value: RECORDING_SECRET
- op: replace
  path: "/spec/template/spec/containers/0/env/58"
  value:
    name: RECORDING_SECRET
    valueFrom:
      secretKeyRef:
        name: nextcloud-aio-secrets
        key: RECORDING_SECRET
- op: test
  path: "/spec/template/spec/containers/0/env/60/name"
  value: REDIS_HOST_PASSWORD
- op: replace
  path: "/spec/template/spec/containers/0/env/60"
  value:
    name: REDIS_HOST_PASSWORD
    valueFrom:
      secretKeyRef:
        name: nextcloud-aio-secrets
        key: REDIS_PASSWORD
- op: test
  path: "/spec/template/spec/containers/0/env/63/name"
  value: SIGNALING_SECRET
- op: replace
  path: "/spec/template/spec/containers/0/env/63"
  value:
    name: SIGNALING_SECRET
    valueFrom:
      secretKeyRef:
        name: nextcloud-aio-secrets
        key: SIGNALING_SECRET
- op: test
  path: "/spec/template/spec/containers/0/env/70/name"
  value: TURN_SECRET
- op: replace
  path: "/spec/template/spec/containers/0/env/70"
  value:
    name: TURN_SECRET
    valueFrom:
      secretKeyRef:
        name: nextcloud-aio-secrets
        key: TURN_SECRET
- op: test
  path: "/spec/template/spec/containers/0/env/74/name"
  value: WHITEBOARD_SECRET
- op: replace
  path: "/spec/template/spec/containers/0/env/74"
  value:
    name: WHITEBOARD_SECRET
    valueFrom:
      secretKeyRef:
        name: nextcloud-aio-secrets
        key: WHITEBOARD_SECRET
- op: add
  path: "/spec/template/spec/containers/0/volumeMounts/-"
  value:
    name: postgres-ca
    mountPath: "/postgres-ca"
    readOnly: true
- op: add
  path: "/spec/template/spec/volumes/-"
  value:
    name: postgres-ca
    secret:
      secretName: nextcloud-aio-postgres-ca
      items:
        - key: ca.crt
          path: "ca.crt"
