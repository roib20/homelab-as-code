---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nextcloud
resources:
  - ../../base
  - external-secrets
  - resources/httproute.yaml
  - resources/backendtrafficpolicy.yaml
  - resources/kanidm-oauth2.yaml
helmCharts:
  - name: nextcloud-aio-helm-chart
    repo: https://nextcloud.github.io/all-in-one/
    version: 14.4.1
    releaseName: nextcloud-aio
    namespace: nextcloud
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - values-override.yaml
configMapGenerator:
  - name: env-vars
    envs:
      - /tmp/env-vars.env
  - name: nextcloud-aio-proxy
    literals:
      - COLLABORA_AUTHORITY=//nextcloud.${FQDN_01}
  - name: nextcloud-oidc
    literals:
      - AUTH_HOST=auth.${FQDN_01}
      - NEXTCLOUD_HOST=nextcloud.${FQDN_01}
    options:
      disableNameSuffixHash: true
replacements:
  - path: replacements.yaml
patches:
  # Explicit targets make disabled optional components a no-op, not newly created Deployments.
  - path: patches/nextcloud-secrets.yaml
    target:
      kind: Deployment
      name: nextcloud-aio-nextcloud
  - path: patches/nextcloud-probes.yaml
    target:
      kind: Deployment
      name: nextcloud-aio-nextcloud
  - path: patches/nextcloud-cacerts.yaml
    target:
      kind: PersistentVolumeClaim
      name: nextcloud-aio-nextcloud-trusted-cacerts
  - path: patches/nextcloud-oidc.yaml
    target:
      kind: Deployment
      name: nextcloud-aio-nextcloud
  - path: patches/database-secrets.yaml
    target:
      kind: Deployment
      name: nextcloud-aio-database
  - path: patches/redis-secrets.yaml
    target:
      kind: Deployment
      name: nextcloud-aio-redis
  - path: patches/talk-secrets.yaml
    target:
      kind: Deployment
      name: nextcloud-aio-talk
  - path: patches/talk-recording-secrets.yaml
    target:
      kind: Deployment
      name: nextcloud-aio-talk-recording
  - path: patches/imaginary-secrets.yaml
    target:
      kind: Deployment
      name: nextcloud-aio-imaginary
  - path: patches/fulltextsearch-secrets.yaml
    target:
      kind: Deployment
      name: nextcloud-aio-fulltextsearch
  - path: patches/onlyoffice-secrets.yaml
    target:
      kind: Deployment
      name: nextcloud-aio-onlyoffice
  - path: patches/eurooffice-secrets.yaml
    target:
      kind: Deployment
      name: nextcloud-aio-eurooffice
  - path: patches/whiteboard-secrets.yaml
    target:
      kind: Deployment
      name: nextcloud-aio-whiteboard
  - path: patches/harp-secrets.yaml
    target:
      kind: Deployment
      name: nextcloud-aio-harp
  - path: patches/apache-service.yaml
    target:
      kind: Service
      name: nextcloud-aio-apache
  - path: patches/apache-wopi.yaml
    target:
      kind: Deployment
      name: nextcloud-aio-apache
  - path: patches/apache-networkpolicy.yaml
    target:
      kind: NetworkPolicy
      name: nextcloud-aio-webserver-allow
