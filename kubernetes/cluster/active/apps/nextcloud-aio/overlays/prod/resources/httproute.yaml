---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nextcloud-aio
  annotations:
    gethomepage.dev/description: Files and collaboration platform.
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Documents & Notes
    gethomepage.dev/icon: nextcloud.svg
    gethomepage.dev/name: Nextcloud
    gethomepage.dev/pod-selector: "io.kompose.service=nextcloud-aio-nextcloud"
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_NEXTCLOUD_TOKEN}}"
    gethomepage.dev/widget.type: "nextcloud"
    gethomepage.dev/widget.url: "https://nextcloud.${FQDN_01}"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: http-gateway-api
      namespace: envoy-gateway-ingress
      sectionName: https-wildcard
  hostnames:
    - nextcloud.${FQDN_01}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/"
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Proto
                value: https
              - name: X-Forwarded-Port
                value: "443"
              - name: X-Forwarded-Host
                value: nextcloud.${FQDN_01}
      timeouts:
        request: "0s"
        backendRequest: "0s"
      backendRefs:
        - group: ""
          kind: Service
          name: nextcloud-aio-apache
          port: 11000
          weight: 1
