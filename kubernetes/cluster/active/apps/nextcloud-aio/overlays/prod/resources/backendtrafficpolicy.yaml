---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: nextcloud-aio
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: nextcloud-aio
  httpUpgrade:
    - type: websocket
  timeout:
    http:
      streamIdleTimeout: 3600s
      maxStreamDuration: "0s"
  # Leave requestBuffer disabled so uploads can stream and high-performance backends can use WebSockets.
