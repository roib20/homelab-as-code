---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nextcloud-aio-postgres-operator
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: nextcloud-aio-postgres
  policyTypes:
    - Ingress
  # AIO otherwise denies ingress from the operator's namespace.
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - protocol: TCP
          port: 8000
