---
global:
  createDefaultServiceAccount: true
defaultPodOptions:
  automountServiceAccountToken: false
controllers:
  omnitools:
    strategy: RollingUpdate
    pod:
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsGroup: 1000
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
    containers:
      main:
        image:
          repository: mirror.gcr.io/iib0011/omni-tools
          tag: 0.7.0@sha256:85f0e052a97326396c753e39de0ef74631c0783999ccca81ebc36262903ec9fa
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 500Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            add:
              - NET_BIND_SERVICE
            drop:
              - ALL
        probes:
          liveness:
            enabled: true
            type: HTTP
          readiness:
            enabled: true
            type: HTTP
service:
  main:
    controller: omnitools
    ports:
      http:
        port: &port 80
persistence:
  tmpfs:
    type: emptyDir
    globalMounts:
      - path: /tmp
        subPath: tmp
      - path: /run
        subPath: run
      - path: /var/cache/nginx
        subPath: nginx
