---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: omnitools
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: Web tools collection.
    gethomepage.dev/group: Toolkits
    gethomepage.dev/icon: omni-tools.webp
    gethomepage.dev/name: OmniTools
    gethomepage.dev/pod-selector: "app.kubernetes.io/instance=omnitools"
    gethomepage.dev/widget.metrics.0.format.type: "percent"
    gethomepage.dev/widget.metrics.0.label: "CPU"
    gethomepage.dev/widget.metrics.0.query: '100 * sum(max by (pod, container) (rate(container_cpu_usage_seconds_total{namespace="omnitools",pod=~"omnitools-.*",container="main"}[5m])))'
    gethomepage.dev/widget.metrics.1.format.type: "bytes"
    gethomepage.dev/widget.metrics.1.label: "RAM"
    gethomepage.dev/widget.metrics.1.query: 'sum(max by (pod, container) (container_memory_working_set_bytes{namespace="omnitools",pod=~"omnitools-.*",container="main"}))'
    gethomepage.dev/widget.type: "prometheusmetric"
    gethomepage.dev/widget.url: "http://vmsingle-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8428"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: http-gateway-api
      namespace: envoy-gateway-ingress
  hostnames:
    - "omnitools.${FQDN_01}"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: omnitools
          namespace: omnitools
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
