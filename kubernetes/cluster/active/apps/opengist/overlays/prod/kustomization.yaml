---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - external-secrets
  - resources/cnpg-cluster.yaml
  - resources/httproute.yaml
components:
  - ../../../../../../components/kopiur-volume
  - ../../../../../../components/cnpg-backup
helmCharts:
  - name: opengist
    repo: https://helm.opengist.io
    version: 0.13.0
    releaseName: opengist
    namespace: opengist
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - values-override.yaml
    includeCRDs: true
patches:
  - path: patches/service-http-targetport.yaml
  - path: patches/statefulset-command.yaml
  - target:
      kind: ObjectStore
      name: cnpg-backups
    patch: |-
      - op: replace
        path: /spec/configuration/destinationPath
        value: s3://k8s-backups/cnpg/opengist
  - target:
      kind: ScheduledBackup
      name: cnpg-backup
    patch: |-
      - op: replace
        path: /spec/schedule
        value: "0 0 23 * * *"
  - target:
      kind: SnapshotPolicy
      name: kopiur-snapshot-policy
    patch: |-
      - op: replace
        path: /spec/sources/0/pvcSelector/labelSelector/matchLabels/kopiur.home-operations.com~1policy
        value: opengist
  - target:
      kind: PersistentVolumeClaim
      name: opengist-shared
    patch: |-
      - op: add
        path: /metadata/labels/kopiur.home-operations.com~1policy
        value: opengist
      - op: add
        path: /spec/dataSourceRef
        value:
          apiGroup: kopiur.home-operations.com
          kind: Restore
          name: kopiur-restore
configMapGenerator:
  - name: env-vars
    envs:
      - /tmp/env-vars.env
  - name: opengist-oidc
    literals:
      - AUTH_HOST=auth.${FQDN_01}
    options:
      disableNameSuffixHash: true
replacements:
  - path: replacements.yaml
