---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - external-secrets
  - resources/cnpg-cluster.yaml
  - resources/httproute.yaml
components:
  - ../../../../../../components/cnpg-backup
helmCharts:
  - name: opengist
    repo: https://helm.opengist.io
    version: 0.13.0
    releaseName: opengist
    namespace: opengist
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - values-override.yaml
    includeCRDs: true
patches:
  - path: patches/service-http-targetport.yaml
  - path: patches/statefulset-command.yaml
  - target:
      kind: ObjectStore
      name: cnpg-backups
    patch: |-
      - op: replace
        path: /spec/configuration/destinationPath
        value: s3://k8s-backups/cnpg/opengist
configMapGenerator:
  - name: env-vars
    envs:
      - /tmp/env-vars.env
  - name: opengist-oidc
    literals:
      - AUTH_HOST=auth.${FQDN_01}
    options:
      disableNameSuffixHash: true
replacements:
  - path: replacements.yaml
