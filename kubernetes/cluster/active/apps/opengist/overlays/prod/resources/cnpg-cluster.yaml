---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: opengist-postgres
  namespace: opengist
spec:
  instances: 1
  postgresql:
    pg_hba:
      - hostssl opengist opengist all scram-sha-256
      - host opengist opengist all reject
  bootstrap:
    recovery:
      source: clusterBackup
  externalClusters:
    - name: clusterBackup
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: cnpg-backups
          serverName: opengist-postgres
  managed:
    services:
      disabledDefaultServices:
        - ro
        - r
  storage:
    size: 2Gi
    storageClass: longhorn-cnpg
  resources:
    requests:
      cpu: 15m
      memory: 128Mi
    limits:
      memory: 512Mi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: cnpg-backups
