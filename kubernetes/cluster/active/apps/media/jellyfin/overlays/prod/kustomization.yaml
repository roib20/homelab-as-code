---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - resources/httproute.yaml
  - resources/pvc-smb-mediadata-rox.yaml
  - resources/resource-claim-template.yaml
components:
  - ../../../../../../../components/kopiur-volume
patches:
  - path: patches/deployment-patch.yaml
    target:
      kind: Deployment
      name: jellyfin
  - target:
      kind: SnapshotPolicy
      name: kopiur-snapshot-policy
    patch: |-
      - op: replace
        path: /spec/sources/0/pvcSelector/labelSelector/matchLabels/kopiur.home-operations.com~1policy
        value: jellyfin
  - target:
      kind: PersistentVolumeClaim
      name: jellyfin-config
    patch: |-
      - op: add
        path: /metadata/labels/kopiur.home-operations.com~1policy
        value: jellyfin
      - op: add
        path: /spec/dataSourceRef
        value:
          apiGroup: kopiur.home-operations.com
          kind: Restore
          name: kopiur-restore
  - target:
      kind: PersistentVolumeClaim
      name: jellyfin-data
    patch: |-
      - op: add
        path: /metadata/labels/kopiur.home-operations.com~1policy
        value: jellyfin
      - op: add
        path: /spec/dataSourceRef
        value:
          apiGroup: kopiur.home-operations.com
          kind: Restore
          name: kopiur-restore
helmCharts:
  - name: jellyfin
    repo: oci://oci.trueforge.org/truecharts
    version: 24.1.2
    releaseName: jellyfin
    namespace: jellyfin
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - values-override.yaml
    includeCRDs: true
configMapGenerator:
  - name: env-vars
    envs:
      - /tmp/env-vars.env
replacements:
  - path: replacements.yaml
