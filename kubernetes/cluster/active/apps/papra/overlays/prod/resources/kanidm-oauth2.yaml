---
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: papra
  namespace: papra
spec:
  kanidmRef:
    name: idm
    namespace: kaniop
  displayname: Papra
  origin: https://papra.${FQDN_01}
  redirectUrl:
    - https://papra.${FQDN_01}/api/auth/oauth2/callback/kanidm
  scopeMap:
    - group: papra-users
      scopes:
        - email
        - openid
        - profile
