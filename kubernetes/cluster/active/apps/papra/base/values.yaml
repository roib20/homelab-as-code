---
global:
  createDefaultServiceAccount: false
defaultPodOptions:
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
controllers:
  papra:
    containers:
      papra:
        image:
          repository: ghcr.io/papra-hq/papra
          tag: 26.7.1-rootless@sha256:d1f596a35332ad04d8a69d88a5e19bc82acd47f2bc2fe687dd2145b1ef5a8b19
        env:
          BETTER_AUTH_TELEMETRY: "0"
          HOME: "/home/nonroot"
          POSTHOG_ENABLED: "false"
          TMPDIR: "/tmp"
          XDG_CACHE_HOME: "/tmp/cache"
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/ping
                port: 1221
              failureThreshold: 3
              periodSeconds: 20
              timeoutSeconds: 5
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/health
                port: 1221
              failureThreshold: 3
              periodSeconds: 10
              timeoutSeconds: 5
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/health
                port: 1221
              failureThreshold: 60
              periodSeconds: 5
              timeoutSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 512Mi
service:
  papra:
    controller: papra
    ports:
      http:
        port: 1221
persistence:
  data:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 2Gi
    globalMounts:
      - path: "/app/app-data"
  home:
    type: emptyDir
    globalMounts:
      - path: "/home/nonroot"
  ingestion:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 2Gi
    globalMounts:
      - path: "/app/ingestion"
  tmp:
    type: emptyDir
    globalMounts:
      - path: "/tmp"
