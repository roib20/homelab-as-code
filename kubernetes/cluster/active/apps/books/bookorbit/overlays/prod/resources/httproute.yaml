---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bookorbit
  annotations:
    gethomepage.dev/description: Self-hosted book library manager.
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Reading
    gethomepage.dev/icon: sh-bookorbit.webp
    gethomepage.dev/name: BookOrbit
    gethomepage.dev/pod-selector: "app.kubernetes.io/instance=bookorbit"
    gethomepage.dev/widget.fields: '["books", "authors", "series", "storage", "reading", "finished"]'
    gethomepage.dev/widget.password: "{{HOMEPAGE_VAR_BOOKORBIT_PASSWORD}}"
    gethomepage.dev/widget.type: "bookorbit"
    gethomepage.dev/widget.url: "http://bookorbit.bookorbit.svc.cluster.local:3000"
    gethomepage.dev/widget.username: "{{HOMEPAGE_VAR_BOOKORBIT_USERNAME}}"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: http-gateway-api
      namespace: envoy-gateway-ingress
  hostnames:
    - "books.${FQDN_01}"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: bookorbit
          namespace: bookorbit
          port: 3000
          weight: 1
      timeouts:
        request: 5m
      matches:
        - path:
            type: PathPrefix
            value: /
