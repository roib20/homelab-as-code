---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - external-secrets
  - resources/cnpg-cluster.yaml
  - resources/httproute.yaml
  - resources/oidc.yaml
  - resources/smb-mediadata-rwx.yaml
components:
  - ../../../../../../../components/kopiur-volume
  - ../../../../../../../components/cnpg-backup
helmCharts:
  - name: app-template
    repo: oci://ghcr.io/bjw-s-labs/helm
    version: 5.2.0
    releaseName: bookorbit
    namespace: bookorbit
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - values-override.yaml
    includeCRDs: true
configMapGenerator:
  - name: env-vars
    envs:
      - /tmp/env-vars.env
replacements:
  - path: replacements.yaml
patches:
  - path: patches/bootstrap-oidc.yaml
    target:
      kind: Deployment
      name: bookorbit
      namespace: bookorbit
  - path: patches/bootstrap-plugins.yaml
    target:
      kind: Deployment
      name: bookorbit
      namespace: bookorbit
  - target:
      kind: ObjectStore
      name: cnpg-backups
    patch: |-
      - op: replace
        path: /spec/configuration/destinationPath
        value: s3://k8s-backups/cnpg/bookorbit
  - target:
      kind: ScheduledBackup
      name: cnpg-backup
    patch: |-
      - op: replace
        path: /spec/schedule
        value: "0 0 21 * * *"
  - target:
      kind: SnapshotPolicy
      name: kopiur-snapshot-policy
    patch: |-
      - op: replace
        path: /spec/sources/0/pvcSelector/labelSelector/matchLabels/kopiur.home-operations.com~1policy
        value: bookorbit
  - target:
      kind: PersistentVolumeClaim
      name: bookorbit
    patch: |-
      - op: add
        path: /metadata/labels/kopiur.home-operations.com~1policy
        value: bookorbit
      - op: add
        path: /spec/dataSourceRef
        value:
          apiGroup: kopiur.home-operations.com
          kind: Restore
          name: kopiur-restore
