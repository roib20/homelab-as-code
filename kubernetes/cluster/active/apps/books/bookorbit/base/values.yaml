---
global:
  createDefaultServiceAccount: true
defaultPodOptions:
  automountServiceAccountToken: false
controllers:
  bookorbit:
    replicas: 1
    strategy: Recreate
    pod:
      annotations:
        secret.reloader.stakater.com/reload: "bookorbit-postgres-app,bookorbit-postgres-ca,bookorbit-secrets,bookorbit-kanidm-oauth2-credentials"
        configmap.reloader.stakater.com/reload: "bookorbit-oidc"
      terminationGracePeriodSeconds: 60
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: bookorbit-gpu-claim
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    initContainers:
      install-vulkan:
        image:
          repository: ghcr.io/bookorbit/bookorbit-read-aloud-worker
          tag: 3.8.0@sha256:830f4ea19d3ff74c53526a470525da926f5a2cd751c636eb2abdfb95c19d57a8
        command:
          - /bin/sh
          - -ec
          - |
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install --assume-yes --no-install-recommends mesa-vulkan-drivers
            cp --dereference "/usr/lib/x86_64-linux-gnu/libvulkan_intel.so" "/vulkan/libvulkan_intel.so"
            sed 's#[^"]*libvulkan_intel\.so#/vulkan/libvulkan_intel.so#' \
              "/usr/share/vulkan/icd.d/intel_icd.json" > "/vulkan/intel_icd.json"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 0
          capabilities:
            drop:
              - ALL
            add:
              - CHOWN
              - DAC_OVERRIDE
              - FOWNER
              - SETGID
              - SETUID
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
      wait-for-postgres:
        image:
          repository: ghcr.io/wait4x/wait4x
          tag: 3.7.3@sha256:aae91ea65a38117ac07c84c7e1122691ac91c3b60529edcb8fe62292d105d8ff
        args:
          - postgresql
          - $(POSTGRES_URI)?sslmode=verify-full&sslrootcert=/postgres-ca/ca.crt
        env:
          POSTGRES_URI:
            valueFrom:
              secretKeyRef:
                name: bookorbit-postgres-app
                key: uri
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            memory: 32Mi
    containers:
      app:
        image:
          repository: ghcr.io/bookorbit/bookorbit
          tag: 3.8.0@sha256:d318f7732f6f6330312e2c5f854f7899f858b54cc4b18a13cde1f43b5bea0515
        env:
          NODE_ENV: production
          PORT: &port 3000
          # Declared first so DATABASE_URL can reference it via $(DATABASE_CONN_URI)
          DATABASE_CONN_URI:
            valueFrom:
              secretKeyRef:
                name: bookorbit-postgres-app
                key: uri
          DATABASE_URL: "$(DATABASE_CONN_URI)?sslmode=verify-full&sslrootcert=/postgres-ca/ca.crt"
          # Public/external URL — used for OIDC redirect-URI validation
          # (${APP_URL}/oauth2-callback), password-reset links, and Kobo endpoints.
          # Must be the browser-facing origin, not the in-cluster Service URL.
          APP_URL: "https://books.${FQDN_01}"
          CLIENT_URL: "https://books.${FQDN_01}"
          # Kanidm (auth.${FQDN_01}) resolves to a private LAN address. In
          # production BookOrbit's SSRF guard blocks OIDC discovery to private
          # issuers, failing both the Test button and the real login flow with
          # PrivateAddressException. We trust the internal network, so allow it.
          OIDC_ALLOW_LOCAL_ISSUERS: "true"
          PUID: "1000"
          PGID: "1000"
          NODE_MAX_OLD_SPACE_SIZE: "2048"
          DISABLE_LOCAL_AUTH: "true"
          READ_ALOUD_WORKER_URL: "http://127.0.0.1:8787"
        envFrom:
          - secretRef:
              name: bookorbit-secrets
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: "/api/v1/health"
                port: *port
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: "/api/v1/health"
                port: *port
              initialDelaySeconds: 20
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/v1/health
                port: *port
              failureThreshold: 30
              periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 10m
            memory: 96Mi
          limits:
            memory: 2Gi
      read-aloud-worker:
        image:
          repository: ghcr.io/bookorbit/bookorbit-read-aloud-worker
          tag: 3.8.0@sha256:830f4ea19d3ff74c53526a470525da926f5a2cd751c636eb2abdfb95c19d57a8
        env:
          READ_ALOUD_WORKER_HOST: "127.0.0.1"
          PORT: 8787
          READ_ALOUD_WORKER_TOKEN:
            valueFrom:
              secretKeyRef:
                name: bookorbit-secrets
                key: READ_ALOUD_WORKER_TOKEN
          READ_ALOUD_LIBRARY_ROOTS: "/library"
          READ_ALOUD_WORK_ROOT: "/data/read-aloud/jobs"
          READ_ALOUD_CTC_DEVICE: webgpu
          LD_LIBRARY_PATH: "/vulkan"
          VK_DRIVER_FILES: "/vulkan/intel_icd.json"
          XDG_CACHE_HOME: "/cache"
        probes:
          liveness:
            enabled: true
            custom: true
            spec: &worker-health
              exec:
                command:
                  - node
                  - -e
                  - >-
                    fetch('http://127.0.0.1:8787/health', {
                      headers: {authorization: 'Bearer ' + process.env.READ_ALOUD_WORKER_TOKEN.trim()},
                      signal: AbortSignal.timeout(5000)
                    }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 5
          startup:
            enabled: true
            custom: true
            spec:
              <<: *worker-health
              periodSeconds: 10
              failureThreshold: 30
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          claims:
            - name: gpu
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 4Gi
      edge-tts:
        image:
          repository: ghcr.io/dejavumoe/edgetts
          tag: 1.0.3@sha256:420878ad9542bdfb01ebdf9da588645e9f375362540e1e1be0ea0ca864931691
        env:
          API_KEY:
            valueFrom:
              secretKeyRef:
                name: bookorbit-secrets
                key: EDGE_TTS_API_KEY
          HOST: "127.0.0.1"
          PORT: 8080
          REQUIRE_API_KEY: "true"
          SERVE_STATIC: "false"
        probes:
          liveness:
            enabled: true
            custom: true
            spec: &edge-tts-health
              exec:
                command:
                  - bun
                  - -e
                  - >-
                    fetch('http://127.0.0.1:8080/health', {
                      signal: AbortSignal.timeout(5000)
                    }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 3
          startup:
            enabled: true
            custom: true
            spec:
              <<: *edge-tts-health
              periodSeconds: 10
              failureThreshold: 30
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
      edge-tts-proxy:
        image:
          repository: mirror.gcr.io/library/caddy
          tag: 2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
        env:
          XDG_CONFIG_HOME: "/tmp"
          XDG_DATA_HOME: "/tmp"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            memory: 128Mi
configMaps:
  edge-tts-proxy:
    data:
      Caddyfile: |
        {
          admin off
          persist_config off
        }
        :8880 {
          bind 127.0.0.1 ::1
          rewrite /v1/audio/voices /api/voices
          reverse_proxy 127.0.0.1:8080
        }
service:
  app:
    ports:
      http:
        port: *port
persistence:
  edge-tts-proxy-config:
    type: configMap
    identifier: edge-tts-proxy
    advancedMounts:
      bookorbit:
        edge-tts-proxy:
          - path: "/etc/caddy"
            readOnly: true
  vulkan:
    type: emptyDir
    advancedMounts:
      bookorbit:
        install-vulkan:
          - path: "/vulkan"
        read-aloud-worker:
          - path: "/vulkan"
            readOnly: true
  shader-cache:
    accessMode: ReadWriteOnce
    size: 1Gi
    storageClass: longhorn
    advancedMounts:
      bookorbit:
        read-aloud-worker:
          - path: "/cache"
