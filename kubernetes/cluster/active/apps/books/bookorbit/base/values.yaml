---
global:
  createDefaultServiceAccount: true
defaultPodOptions:
  automountServiceAccountToken: false
controllers:
  bookorbit:
    replicas: 1
    strategy: Recreate
    pod:
      annotations:
        secret.reloader.stakater.com/reload: "bookorbit-postgres-app,bookorbit-postgres-ca,bookorbit-secrets,bookorbit-kanidm-oauth2-credentials"
        configmap.reloader.stakater.com/reload: "bookorbit-oidc"
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    initContainers:
      wait-for-postgres:
        image:
          repository: ghcr.io/wait4x/wait4x
          tag: 3.7.3@sha256:aae91ea65a38117ac07c84c7e1122691ac91c3b60529edcb8fe62292d105d8ff
        args:
          - postgresql
          - $(POSTGRES_URI)?sslmode=verify-full&sslrootcert=/postgres-ca/ca.crt
        env:
          POSTGRES_URI:
            valueFrom:
              secretKeyRef:
                name: bookorbit-postgres-app
                key: uri
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            memory: 32Mi
    containers:
      app:
        image:
          repository: ghcr.io/bookorbit/bookorbit
          tag: 3.7.0@sha256:0d5f4a31576a2bcd96afa77b8eac75c3b8df395f0f9b9215995de59236f22b95
        env:
          NODE_ENV: production
          PORT: &port 3000
          # Declared first so DATABASE_URL can reference it via $(DATABASE_CONN_URI)
          DATABASE_CONN_URI:
            valueFrom:
              secretKeyRef:
                name: bookorbit-postgres-app
                key: uri
          DATABASE_URL: "$(DATABASE_CONN_URI)?sslmode=verify-full&sslrootcert=/postgres-ca/ca.crt"
          # Public/external URL — used for OIDC redirect-URI validation
          # (${APP_URL}/oauth2-callback), password-reset links, and Kobo endpoints.
          # Must be the browser-facing origin, not the in-cluster Service URL.
          APP_URL: "https://books.${FQDN_01}"
          CLIENT_URL: "https://books.${FQDN_01}"
          # Kanidm (auth.${FQDN_01}) resolves to a private LAN address. In
          # production BookOrbit's SSRF guard blocks OIDC discovery to private
          # issuers, failing both the Test button and the real login flow with
          # PrivateAddressException. We trust the internal network, so allow it.
          OIDC_ALLOW_LOCAL_ISSUERS: "true"
          PUID: "1000"
          PGID: "1000"
          NODE_MAX_OLD_SPACE_SIZE: "2048"
          DISABLE_LOCAL_AUTH: "false"
          READ_ALOUD_WORKER_URL: "http://127.0.0.1:8787"
        envFrom:
          - secretRef:
              name: bookorbit-secrets
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: "/api/v1/health"
                port: *port
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: "/api/v1/health"
                port: *port
              initialDelaySeconds: 20
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/v1/health
                port: *port
              failureThreshold: 30
              periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 10m
            memory: 96Mi
          limits:
            memory: 2Gi
      read-aloud-worker:
        image:
          repository: ghcr.io/bookorbit/bookorbit-read-aloud-worker
          tag: 3.7.0@sha256:451dad18a5772716b3383552c40ac329836178a48058cdee6a31c3051569dc4f
        env:
          READ_ALOUD_WORKER_HOST: "127.0.0.1"
          PORT: 8787
          READ_ALOUD_WORKER_TOKEN:
            valueFrom:
              secretKeyRef:
                name: bookorbit-secrets
                key: READ_ALOUD_WORKER_TOKEN
          READ_ALOUD_LIBRARY_ROOTS: "/books,/audiobooks,/comics,/textbooks"
          READ_ALOUD_WORK_ROOT: "/data/read-aloud/jobs"
          READ_ALOUD_CTC_DEVICE: cpu
        probes:
          liveness:
            enabled: true
            custom: true
            spec: &worker-health
              exec:
                command:
                  - node
                  - -e
                  - >-
                    fetch('http://127.0.0.1:8787/health', {
                      headers: {authorization: 'Bearer ' + process.env.READ_ALOUD_WORKER_TOKEN.trim()},
                      signal: AbortSignal.timeout(5000)
                    }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 5
          startup:
            enabled: true
            custom: true
            spec:
              <<: *worker-health
              periodSeconds: 10
              failureThreshold: 30
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 4Gi
service:
  app:
    ports:
      http:
        port: *port
