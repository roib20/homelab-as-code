---
global:
  createDefaultServiceAccount: true
defaultPodOptions:
  automountServiceAccountToken: false
controllers:
  bookorbit:
    pod:
      annotations:
        secret.reloader.stakater.com/reload: "bookorbit-postgres-app,bookorbit-postgres-ca,bookorbit-secrets,bookorbit-kanidm-oauth2-credentials"
        configmap.reloader.stakater.com/reload: "bookorbit-oidc"
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    initContainers:
      wait-for-postgres:
        image:
          repository: ghcr.io/wait4x/wait4x
          tag: 3.7.1@sha256:4168ec1328e4fa51b82f7d601c18813b5e4aa85d0eda237cf3501b4ddd70d2c5
        args:
          - postgresql
          - $(POSTGRES_URI)?sslmode=verify-full&sslrootcert=/postgres-ca/ca.crt
        env:
          POSTGRES_URI:
            valueFrom:
              secretKeyRef:
                name: bookorbit-postgres-app
                key: uri
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            cpu: 10m
            memory: 32Mi
    containers:
      app:
        image:
          repository: ghcr.io/bookorbit/bookorbit
          tag: 2.7.0@sha256:0f46241c54ba7cd07ddf7dc519386a29c98dd0f3679cebc9ca35f3305dc79e69
        env:
          NODE_ENV: production
          PORT: &port 3000
          # Declared first so DATABASE_URL can reference it via $(DATABASE_CONN_URI)
          DATABASE_CONN_URI:
            valueFrom:
              secretKeyRef:
                name: bookorbit-postgres-app
                key: uri
          DATABASE_URL: "$(DATABASE_CONN_URI)?sslmode=verify-full&sslrootcert=/postgres-ca/ca.crt"
          JWT_SECRET:
            valueFrom:
              secretKeyRef:
                name: bookorbit-secrets
                key: JWT_SECRET
          SETUP_BOOTSTRAP_TOKEN:
            valueFrom:
              secretKeyRef:
                name: bookorbit-secrets
                key: SETUP_BOOTSTRAP_TOKEN
          EMAIL_ENCRYPTION_KEY:
            valueFrom:
              secretKeyRef:
                name: bookorbit-secrets
                key: EMAIL_ENCRYPTION_KEY
          MIGRATION_ENCRYPTION_KEY:
            valueFrom:
              secretKeyRef:
                name: bookorbit-secrets
                key: MIGRATION_ENCRYPTION_KEY
          # Public/external URL — used for OIDC redirect-URI validation
          # (${APP_URL}/oauth2-callback), password-reset links, and Kobo endpoints.
          # Must be the browser-facing origin, not the in-cluster Service URL.
          APP_URL: "https://books.${FQDN_01}"
          CLIENT_URL: "https://books.${FQDN_01}"
          # Kanidm (auth.${FQDN_01}) resolves to a private LAN address. In
          # production BookOrbit's SSRF guard blocks OIDC discovery to private
          # issuers, failing both the Test button and the real login flow with
          # PrivateAddressException. We trust the internal network, so allow it.
          OIDC_ALLOW_LOCAL_ISSUERS: "true"
          PUID: "1000"
          PGID: "1000"
          NODE_MAX_OLD_SPACE_SIZE: "2048"
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: "/api/v1/health"
                port: *port
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: "/api/v1/health"
                port: *port
              initialDelaySeconds: 20
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/v1/health
                port: *port
              failureThreshold: 30
              periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 2Gi
service:
  app:
    ports:
      http:
        port: *port
