---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cyberchef
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: Data transformation toolkit.
    gethomepage.dev/group: Toolkits
    gethomepage.dev/icon: cyberchef.svg
    gethomepage.dev/name: CyberChef
    gethomepage.dev/pod-selector: "app.kubernetes.io/instance=cyberchef"
    gethomepage.dev/widget.metrics.0.format.type: "percent"
    gethomepage.dev/widget.metrics.0.label: "CPU"
    gethomepage.dev/widget.metrics.0.query: '100 * sum(max by (pod, container) (rate(container_cpu_usage_seconds_total{namespace="cyberchef",pod=~"cyberchef-.*",container="cyberchef"}[5m])))'
    gethomepage.dev/widget.metrics.1.format.type: "bytes"
    gethomepage.dev/widget.metrics.1.label: "RAM"
    gethomepage.dev/widget.metrics.1.query: 'sum(max by (pod, container) (container_memory_working_set_bytes{namespace="cyberchef",pod=~"cyberchef-.*",container="cyberchef"}))'
    gethomepage.dev/widget.type: "prometheusmetric"
    gethomepage.dev/widget.url: "http://vmsingle-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8428"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: http-gateway-api
      namespace: envoy-gateway-ingress
  hostnames:
    - "cyberchef.${FQDN_01}"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: cyberchef
          namespace: cyberchef
          port: 10219
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
