---
- source:
    kind: ConfigMap
    name: env-vars
    fieldPath: "data.FQDN_02"
  targets:
    # PVE egress targets
    - select:
        kind: Service
        name: pve-node-0[1234]
      fieldPaths:
        - metadata.annotations.[tailscale.com/tailnet-fqdn]
      options:
        delimiter: "."
        index: 1
    # Homepage substitutes this domain in the PVE card links at runtime.
    - select:
        kind: Deployment
        name: homepage
      fieldPaths:
        - spec.template.spec.containers.[name=homepage].env.[name=HOMEPAGE_VAR_FQDN_02].value
    # Deployment container env var
    - select:
        kind: Deployment
        name: homepage
      fieldPaths:
        - spec.template.spec.containers.[name=homepage].env.[name=HOMEPAGE_ALLOWED_HOSTS].value
      options:
        delimiter: "."
        index: 1
    # Ingress
    - select:
        kind: Ingress
        name: homepage
      fieldPaths:
        - spec.rules.0.host
        - spec.tls.0.hosts.0
      options:
        delimiter: "."
        index: 1
