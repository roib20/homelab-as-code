---
configmap:
  config:
    data:
      custom.css: |
        #page_wrapper .select-none, #tabs [role="tab"] { -webkit-user-select: text; user-select: text; }
        #information-widgets,
        #myTab,
        .bookmark > a,
        .service .service-card {
          --glass-specular: rgb(255 255 255 / 50%);
          --glass-specular-soft: rgb(255 255 255 / 20%);
          --glass-bloom: rgb(var(--color-200) / 10%);
          --glass-rim-width: 2px;
          --glass-rim-color: rgb(var(--color-200) / 50%);
          --glass-shine: rgb(255 255 255 / 90%);
          --glass-rim-soft: rgb(var(--color-400) / 20%);
          --glass-hover-outline: rgb(var(--color-200) / 70%);
          --glass-shadow-hover: rgb(0 0 0 / 10%);
          --glass-shadow: rgb(0 0 0 / 10%);
          --glass-well: rgb(0 0 0 / 10%);
          --glass-outline: rgb(var(--color-400) / 40%);
          --glass-tab: rgb(var(--bg-color) / 60%);
          --glass-opaque: rgb(var(--bg-color));
          position: relative;
          isolation: isolate;
          background: rgb(var(--bg-color) / 90%);
          border: 1px solid rgb(255 255 255 / 20%);
          border-radius: 24px;
          box-shadow: 0 2px 8px rgb(0 0 0 / 10%), inset 0 1px 2px rgb(255 255 255 / 20%), inset 0 -1px 2px rgb(255 255 255 / 10%);
        }

        #information-widgets::before {
          content: "";
          position: absolute;
          inset: 0;
          border-radius: inherit;
          padding: 1px;
          background: linear-gradient(140deg, rgb(255 255 255 / 80%), transparent 40%, rgb(255 255 255 / 10%) 70%, rgb(255 255 255 / 50%));
          -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
          mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
          -webkit-mask-composite: xor;
          mask-composite: exclude;
          pointer-events: none;
        }

        .service-card > *,
        .bookmark > a > *,
        #myTab > * {
          position: relative;
          z-index: 1;
        }

        .service-card::before,
        .bookmark > a::before,
        #tabs > ul::before {
          content: "";
          position: absolute;
          inset: 0;
          z-index: 0;
          pointer-events: none;
          border-radius: inherit;
          background:
            radial-gradient(ellipse 90% 70% at 0% -10%,
              var(--glass-specular-soft), transparent 70%),
            radial-gradient(ellipse 80% 50% at 100% 110%,
              var(--glass-bloom), transparent 80%),
            linear-gradient(110deg,
              transparent 30%,
              var(--glass-specular-soft) 50%,
              transparent 60%);
          opacity: .6;
          transition: opacity 200ms ease;
        }

        /* Masked optical rim: a separate backdrop filter near the curved edge. */
        .service-card::after,
        .bookmark > a::after,
        #tabs > ul::after {
          content: "";
          position: absolute;
          inset: 0;
          z-index: 2;
          pointer-events: none;
          border-radius: inherit;
          padding: var(--glass-rim-width);
          background: conic-gradient(from 230deg,
            var(--glass-rim-color) 0deg,
            var(--glass-shine) 50deg,
            transparent 120deg,
            var(--glass-rim-soft) 190deg,
            var(--glass-shine) 280deg,
            var(--glass-rim-color) 360deg);
          -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
          -webkit-mask-composite: xor;
          mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
          mask-composite: exclude;
          -webkit-backdrop-filter: blur(2px) saturate(220%);
          backdrop-filter: blur(2px) saturate(220%);
          opacity: .8;
          transition: opacity 200ms ease;
        }

        /* Hover preserves the selected palette: only variables, no fixed cyan/pink. */
        @media (hover: hover) {
          .service-card:hover,
          .bookmark > a:hover {
            transform: translateY(-2px);
            border-color: var(--glass-hover-outline) !important;
            box-shadow:
              inset 0 1px 0 var(--glass-specular),
              inset 1px 0 0 var(--glass-specular-soft),
              0 14px 32px var(--glass-shadow-hover) !important;
          }
          .service-card:hover::before,
          .bookmark > a:hover::before,
          .service-card:hover::after,
          .bookmark > a:hover::after { opacity: 1; }
        }

        /* Preserve widget backgrounds and blockHighlights status colors. */
        .service .service-card {
          padding: 8px;
        }

        .service-card .service-name {
          padding-block: 4px;
        }

        .service-block {
          padding: 2px 4px;
          margin: 2px;
          border-radius: 10px !important;
          box-shadow:
            inset 0 1px 2px var(--glass-well),
            0 1px 0 var(--glass-specular-soft);
        }

        .service-block > * {
          line-height: 1.25;
        }

        .bookmark > a .bookmark-icon {
          border-right: 1px solid var(--glass-outline);
        }

        #myTab,
        #myTab button {
          border-radius: 999px;
        }

        #tabs button[role="tab"] {
          border: 1px solid transparent;
          transition: background 200ms ease, box-shadow 200ms ease,
                      border-color 200ms ease;
        }

        #tabs button[role="tab"][aria-selected="true"] {
          background:
            linear-gradient(150deg, var(--glass-specular-soft), transparent 80%),
            var(--glass-tab) !important;
          border-color: var(--glass-outline);
          box-shadow:
            inset 0 1px 0 var(--glass-specular),
            0 3px 10px var(--glass-shadow);
        }

        .service .service-card,
        .bookmark > a {
          transition: transform 200ms ease, border-color 200ms ease, box-shadow 200ms ease;
        }

        @media (prefers-reduced-motion: reduce) {
          .service-card, .bookmark > a, #tabs > ul,
          #tabs button[role="tab"],
          .service-card::before, .bookmark > a::before, #tabs > ul::before,
          .service-card::after, .bookmark > a::after, #tabs > ul::after {
            transition: none !important;
          }
          .service-card:hover, .bookmark > a:hover { transform: none; }
        }

        @supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
          #information-widgets,
          #myTab,
          .bookmark > a,
          .service .service-card {
            background-color: rgb(var(--bg-color) / 60%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            backdrop-filter: blur(20px) saturate(180%);
          }

          #information-widgets,
          #myTab {
            background-color: rgb(var(--bg-color) / 40%);
          }
        }

        @media (prefers-reduced-transparency: reduce) {
          #information-widgets,
          #myTab,
          #myTab button[role="tab"][aria-selected="true"],
          .bookmark > a,
          .service .service-card {
            background: var(--glass-opaque) !important;
            -webkit-backdrop-filter: none !important;
            backdrop-filter: none !important;
          }
          .service-card::after, .bookmark > a::after, #tabs > ul::after {
            -webkit-backdrop-filter: none;
            backdrop-filter: none;
          }
        }

        #page_wrapper {
          --readable-text: rgb(var(--color-900));
          color: var(--readable-text);
          font-weight: 500;
          text-shadow: 0 1px 1px rgb(255 255 255 / 40%);
        }

        .dark #page_wrapper {
          --readable-text: #fff;
          text-shadow: 0 1px 1px rgb(0 0 0 / 40%);
        }

        #page_wrapper button {
          text-shadow: inherit;
        }

        #page_wrapper .animate-pulse {
          animation: none;
        }

        #page_wrapper [class*="text-theme-"],
        .service-card .site-monitor-status > .uppercase.opacity-20 {
          color: var(--readable-text);
          opacity: 1;
        }

        #page_wrapper .text-gray-500 {
          color: color-mix(in srgb, var(--readable-text) 80%, rgb(var(--bg-color)));
        }

        #page_wrapper .text-xs {
          font-size: 13px;
        }

        .font-thin,
        .font-light {
          font-weight: 500;
        }

        .services-group .service-group-name,
        .bookmarks-group .bookmark-group-name,
        #tabs button,
        .service-card .service-name,
        .service-card .service-block > :first-child {
          font-weight: 600;
        }

        #information-widgets {
          padding: 8px;
        }

        #information-widgets .information-widget-resource {
          padding-block: 2px;
          margin-right: 6px;
        }

        #information-widgets .information-widget-resource > div,
        #information-widgets .widget-inner-text {
          margin-left: 6px;
        }

        .service-card .site-monitor-status > .uppercase {
          font-size: 10px;
        }

        #myTab button:focus-visible,
        .bookmark > a:focus-visible,
        .service-card :is(a, button):focus-visible {
          outline: 2px solid currentColor;
          outline-offset: -3px;
        }

      services.yaml: |
        ---
        - Calendar:
            - Monthly:
                widget:
                  type: calendar
                  firstDayInWeek: sunday
                  view: monthly
                  showTime: true
                  integrations:
                    - type: ical
                      url: "http://yuvomi.yuvomi.svc.cluster.local:3000/feed/calendar/{{`{{HOMEPAGE_VAR_YUVOMI_CALENDAR_TOKEN}}`}}.ics"
                      name: Yuvomi
                      color: violet
                      params:
                        showName: true
                    - type: radarr
                      service_group: Media Automation (HD Video)
                      service_name: Radarr HD
                    - type: sonarr
                      service_group: Media Automation (HD Video)
                      service_name: Sonarr HD
                    - type: radarr
                      service_group: Media Automation (Ultra HD Video)
                      service_name: Radarr UHD
                    - type: sonarr
                      service_group: Media Automation (Ultra HD Video)
                      service_name: Sonarr UHD
        - Agenda:
            - Upcoming Events:
                widget:
                  type: calendar
                  view: agenda
                  showTime: true
                  integrations:
                    - type: ical
                      url: "http://yuvomi.yuvomi.svc.cluster.local:3000/feed/calendar/{{`{{HOMEPAGE_VAR_YUVOMI_CALENDAR_TOKEN}}`}}.ics"
                      name: Yuvomi
                      color: violet
                      params:
                        showName: true
            - Upcoming Media Releases:
                widget:
                  type: calendar
                  view: agenda
                  showTime: false
                  integrations:
                    - type: radarr
                      service_group: Media Automation (HD Video)
                      service_name: Radarr HD
                    - type: sonarr
                      service_group: Media Automation (HD Video)
                      service_name: Sonarr HD
                    - type: radarr
                      service_group: Media Automation (Ultra HD Video)
                      service_name: Radarr UHD
                    - type: sonarr
                      service_group: Media Automation (Ultra HD Video)
                      service_name: Sonarr UHD
        - Cloud Services:
            - Backblaze:
                description: Cloud storage and backups.
                href: https://secure.backblaze.com/
                icon: backblaze.svg
                siteMonitor: https://secure.backblaze.com/
                widget:
                  type: customapi
                  url: https://api.backblazeb2.com/b2api/v4/b2_authorize_account
                  username: "{{`{{HOMEPAGE_VAR_B2_KEY_ID}}`}}"
                  password: "{{`{{HOMEPAGE_VAR_B2_APP_KEY}}`}}"
                  refreshInterval: 900000
                  mappings:
                    - field: apiInfo.storageApi.allowed.buckets
                      label: B2 Buckets
                      format: size
            - Bitwarden:
                description: Password and secrets manager.
                href: https://vault.bitwarden.com/
                icon: bitwarden.svg
                siteMonitor: https://vault.bitwarden.com/
                widget:
                  type: prometheusmetric
                  url: http://vmsingle-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8428
                  refreshInterval: 900000
                  metrics:
                    - label: External Secrets
                      query: 'sum(externalsecret_status_condition{condition="Ready"})'
                      format:
                        type: number
            - Cloudflare:
                description: Cloud infrastructure and security.
                href: https://dash.cloudflare.com/
                icon: cloudflare.svg
                siteMonitor: https://dash.cloudflare.com/
                widgets:
                  - type: customapi
                    url: https://api.cloudflare.com/client/v4/zones?per_page=5
                    refreshInterval: 900000
                    headers:
                      Authorization: "Bearer {{`{{HOMEPAGE_VAR_CLOUDFLARE_TOKEN}}`}}"
                    mappings:
                      - field: result_info.total_count
                        format: number
                        label: Domains
                  - type: customapi
                    url: "https://api.cloudflare.com/client/v4/accounts/{{`{{HOMEPAGE_VAR_CLOUDFLARE_ACCOUNT_ID}}`}}/r2/buckets?per_page=1"
                    refreshInterval: 900000
                    headers:
                      Authorization: "Bearer {{`{{HOMEPAGE_VAR_CLOUDFLARE_TOKEN}}`}}"
                    mappings:
                      - field: result_info.total_count
                        format: number
                        label: R2 Buckets
                  - type: customapi
                    url: "https://api.cloudflare.com/client/v4/accounts/{{`{{HOMEPAGE_VAR_CLOUDFLARE_ACCOUNT_ID}}`}}/r2/buckets?per_page=1"
                    refreshInterval: 900000
                    headers:
                      Authorization: "Bearer {{`{{HOMEPAGE_VAR_CLOUDFLARE_TOKEN}}`}}"
                      cf-r2-jurisdiction: eu
                    mappings:
                      - field: result_info.total_count
                        format: number
                        label: R2 Buckets (EU)
            - GitHub:
                description: World's largest software forge.
                href: https://github.com/
                icon: github.svg
                siteMonitor: https://github.com/
                widget:
                  type: customapi
                  url: https://api.github.com/graphql
                  method: POST
                  refreshInterval: 900000
                  headers:
                    Authorization: "Bearer {{`{{HOMEPAGE_VAR_GITHUB_TOKEN}}`}}"
                    Content-Type: application/json
                    User-Agent: homepage
                  requestBody:
                    query: >-
                      query {
                        viewer {
                          privateRepos: repositories(privacy: PRIVATE, affiliations: OWNER) { totalCount }
                          publicRepos: repositories(privacy: PUBLIC, affiliations: OWNER) { totalCount }
                          allRepos: repositories(affiliations: OWNER) { totalCount }
                        }
                      }
                  mappings:
                    - field: data.viewer.privateRepos.totalCount
                      format: number
                      label: Private Repos
                    - field: data.viewer.publicRepos.totalCount
                      format: number
                      label: Public Repos
                    - field: data.viewer.allRepos.totalCount
                      format: number
                      label: Total Repos
            - Let's Encrypt:
                description: Certificate Authority. Automated TLS certificates via cert-manager.
                href: https://letsencrypt.org/
                icon: lets-encrypt.svg
                siteMonitor: https://letsencrypt.org/
                widget:
                  type: prometheusmetric
                  url: http://vmsingle-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8428
                  refreshInterval: 900000
                  metrics:
                    - label: Certificates
                      query: >-
                        count(count by (exported_namespace, name) (
                          certmanager_certificate_ready_status{issuer_name=~"letsencrypt-.*", condition="True"}
                        ))
                      format:
                        type: number
                    - label: Issuers
                      # ClusterIssuers are shared across namespaces; Issuers are namespace-scoped.
                      query: >-
                        count(
                          count by (issuer_name, issuer_group) (
                            label_replace(
                              certmanager_certificate_ready_status{issuer_name=~"letsencrypt-.*", issuer_kind="ClusterIssuer", condition="True"},
                              "issuer_group", "cert-manager.io", "issuer_group", "^$"
                            )
                          )
                          or count by (exported_namespace, issuer_name, issuer_group) (
                            label_replace(
                              certmanager_certificate_ready_status{issuer_name=~"letsencrypt-.*", issuer_kind=~"Issuer|", condition="True"},
                              "issuer_group", "cert-manager.io", "issuer_group", "^$"
                            )
                          )
                        )
                      format:
                        type: number
                    - label: Next Expiry
                      query: >-
                        min(certmanager_certificate_expiration_timestamp_seconds{issuer_name=~"letsencrypt-.*"} > 0) - time()
                      format:
                        suffix: " to"
                        type: duration
                    - label: Next Renewal
                      query: >-
                        min(certmanager_certificate_renewal_timestamp_seconds{issuer_name=~"letsencrypt-.*"} > 0) - time()
                      format:
                        suffix: " to"
                        type: duration
            - Tailscale:
                description: Private mesh network.
                href: https://console.tailscale.com/
                icon: tailscale.svg
                siteMonitor: https://console.tailscale.com/
                widget:
                  type: customapi
                  url: https://api.tailscale.com/api/v2/tailnet/-/devices
                  refreshInterval: 900000
                  headers:
                    Authorization: "Bearer {{`{{HOMEPAGE_VAR_TAILSCALE_TOKEN}}`}}"
                  mappings:
                    - field: devices
                      format: size
                      label: Machines
        - Systems:
            - Home Assistant:
                description: Home automation platform.
                href: "{{`{{HOMEPAGE_VAR_HOMEASSISTANT_URL}}`}}"
                icon: home-assistant.svg
                siteMonitor: "{{`{{HOMEPAGE_VAR_HOMEASSISTANT_URL}}`}}"
                widget:
                  fields: ["lights_on", "switches_on"]
                  key: "{{`{{HOMEPAGE_VAR_HOMEASSISTANT_KEY}}`}}"
                  type: homeassistant
                  url: "{{`{{HOMEPAGE_VAR_HOMEASSISTANT_URL}}`}}"
            - pve-node-01:
                href: "https://pve-node-01.{{`{{HOMEPAGE_VAR_FQDN_02}}`}}:8006"
                icon: proxmox.png
                siteMonitor: https://pve-node-01.homepage.svc.cluster.local:8006
                widget:
                  fields: ["vms", "lxc", "resources.cpu", "resources.mem"]
                  node: pve-node-01
                  password: "{{`{{HOMEPAGE_VAR_PVE_PASSWORD}}`}}"
                  type: proxmox
                  url: https://pve-node-01.homepage.svc.cluster.local:8006
                  username: "{{`{{HOMEPAGE_VAR_PVE_USERNAME}}`}}"
            - pve-node-02:
                href: "https://pve-node-02.{{`{{HOMEPAGE_VAR_FQDN_02}}`}}:8006"
                icon: proxmox.png
                siteMonitor: https://pve-node-02.homepage.svc.cluster.local:8006
                widget:
                  fields: ["vms", "lxc", "resources.cpu", "resources.mem"]
                  node: pve-node-02
                  password: "{{`{{HOMEPAGE_VAR_PVE_PASSWORD}}`}}"
                  type: proxmox
                  url: https://pve-node-02.homepage.svc.cluster.local:8006
                  username: "{{`{{HOMEPAGE_VAR_PVE_USERNAME}}`}}"
            - pve-node-03:
                href: "https://pve-node-03.{{`{{HOMEPAGE_VAR_FQDN_02}}`}}:8006"
                icon: proxmox.png
                siteMonitor: https://pve-node-03.homepage.svc.cluster.local:8006
                widget:
                  fields: ["vms", "lxc", "resources.cpu", "resources.mem"]
                  node: pve-node-03
                  password: "{{`{{HOMEPAGE_VAR_PVE_PASSWORD}}`}}"
                  type: proxmox
                  url: https://pve-node-03.homepage.svc.cluster.local:8006
                  username: "{{`{{HOMEPAGE_VAR_PVE_USERNAME}}`}}"
            - pve-node-04:
                href: "https://pve-node-04.{{`{{HOMEPAGE_VAR_FQDN_02}}`}}:8006"
                icon: proxmox.png
                siteMonitor: https://pve-node-04.homepage.svc.cluster.local:8006
                widget:
                  fields: ["vms", "lxc", "resources.cpu", "resources.mem"]
                  node: pve-node-04
                  password: "{{`{{HOMEPAGE_VAR_PVE_PASSWORD}}`}}"
                  type: proxmox
                  url: https://pve-node-04.homepage.svc.cluster.local:8006
                  username: "{{`{{HOMEPAGE_VAR_PVE_USERNAME}}`}}"
            - TrueNAS:
                href: https://192.168.1.5
                icon: truenas.png
                siteMonitor: https://192.168.1.5
                widget:
                  enablePools: false
                  fields: ["load", "uptime", "alerts"]
                  key: "{{`{{HOMEPAGE_VAR_TRUENAS_KEY}}`}}"
                  nasType: scale
                  type: truenas
                  url: https://192.168.1.5
                  version: 2
      settings.yaml: |
        ---
        background:
          image: https://picsum.photos/3840/2160
          opacity: 70
        cardBlur: md
        headerStyle: boxed
        layout:
          Cloud Services:
            tab: Home
          Documents & Notes:
            tab: Home
          Downloaders:
            tab: Home
          Media Automation (Configuration):
            tab: Home
          Media Automation (HD Video):
            tab: Home
          Media Automation (Ultra HD Video):
            tab: Home
          Media Libraries:
            tab: Home
          Media Trackers:
            tab: Home
          Operations:
            tab: Home
          Planners:
            tab: Home
          Reading:
            tab: Home
          Systems:
            tab: Home
          Toolkits:
            tab: Home
          Calendar:
            columns: 1
            style: row
            tab: Calendar
          Agenda:
            columns: 2
            header: false
            style: row
            tab: Calendar
        providers:
          longhorn:
            url: http://longhorn-frontend.longhorn-system.svc.cluster.local
        quicklaunch:
          hideInternetSearch: false
          hideVisitURL: false
          provider: google
          searchDescriptions: true
          showSearchSuggestions: true
      widgets.yaml: |
        ---
        - glances:
            href: "https://pve-node-01.{{`{{HOMEPAGE_VAR_FQDN_02}}`}}:8006"
            label: pve-node-01
            url: http://pve-node-01.homepage.svc.cluster.local:61208
            version: 4
        - glances:
            href: "https://pve-node-02.{{`{{HOMEPAGE_VAR_FQDN_02}}`}}:8006"
            label: pve-node-02
            url: http://pve-node-02.homepage.svc.cluster.local:61208
            version: 4
        - glances:
            href: "https://pve-node-03.{{`{{HOMEPAGE_VAR_FQDN_02}}`}}:8006"
            label: pve-node-03
            url: http://pve-node-03.homepage.svc.cluster.local:61208
            version: 4
        - kubernetes:
            cluster:
              show: true
              cpu: true
              memory: true
              showLabel: true
              label: "cluster"
            nodes:
              show: true
              cpu: true
              memory: true
              showLabel: true
        - longhorn:
            expanded: true
            total: true
            labels: true
            nodes: true
global:
  fallbackDefaults:
    storageClass: longhorn
    pvcRetain: false
    pvcSize: 1Gi
ingress:
  main:
    enabled: true
    ingressClassName: tailscale
    annotations:
      tailscale.com/proxy-group: ingress-proxies
    hosts:
      - host: "home.${FQDN_02}"
        paths:
          - path: "/"
            pathType: Prefix
    tls:
      - hosts:
          - "home.${FQDN_02}"
workload:
  main:
    podSpec:
      annotations:
        configmap.reloader.stakater.com/reload: homepage-config
        secret.reloader.stakater.com/reload: homepage-secrets
      containers:
        main:
          env:
            HOMEPAGE_ALLOWED_HOSTS: "localhost,home.${FQDN_02}"
            HOMEPAGE_VAR_FQDN_02: "${FQDN_02}"
          envFrom:
            - secretRef:
                name: homepage-secrets
                expandObjectName: false
