---
# renovate: datasource=github-releases depName=open-noodle/gallery
immichVersion: v5.7.0-rc.1

controllers:
  main:
    containers:
      main:
        image:
          repository: &immichServerRepository ghcr.io/open-noodle/gallery-server
          tag: '{{ .Values.immichVersion }}'

server:
  controllers:
    main:
      containers:
        main:
          image:
            repository: *immichServerRepository
            tag: '{{ .Values.immichVersion }}'
    microservices:
      containers:
        main:
          image:
            repository: *immichServerRepository
            tag: '{{ .Values.immichVersion }}'

machine-learning:
  controllers:
    main:
      strategy: Recreate
      containers:
        main:
          image:
            repository: ghcr.io/open-noodle/gallery-ml
            tag: '{{ .Values.immichVersion }}-openvino'

valkey:
  controllers:
    main:
      containers:
        main:
          image:
            repository: ghcr.io/valkey-io/valkey

immich:
  metrics:
    enabled: true
