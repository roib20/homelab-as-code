---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - external-secrets
  - resources/httproute.yaml
components:
  - ../../../../../../components/kopiur-volume
helmCharts:
  - name: karakeep
    repo: https://karakeep-app.github.io/helm-charts
    version: 0.33.1
    releaseName: karakeep
    namespace: karakeep
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - values-override.yaml
    includeCRDs: true
configMapGenerator:
  - name: env-vars
    envs:
      - /tmp/env-vars.env
  - name: karakeep-oauth
    literals:
      - AUTH_HOST=auth.${FQDN_01}
    options:
      disableNameSuffixHash: true
replacements:
  - path: replacements.yaml
patches:
  - path: patches/karakeep-sts.yaml
  - target:
      kind: SnapshotPolicy
      name: kopiur-snapshot-policy
    patch: |-
      - op: replace
        path: /spec/sources/0/pvcSelector/labelSelector/matchLabels/kopiur.home-operations.com~1policy
        value: karakeep
  - target:
      kind: PersistentVolumeClaim
      name: karakeep-meilisearch
    patch: |-
      - op: add
        path: /metadata/labels/kopiur.home-operations.com~1policy
        value: karakeep
      - op: add
        path: /spec/dataSourceRef
        value:
          apiGroup: kopiur.home-operations.com
          kind: Restore
          name: kopiur-restore
