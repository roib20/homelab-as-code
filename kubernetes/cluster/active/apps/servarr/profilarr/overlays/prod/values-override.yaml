---
global:
  fallbackDefaults:
    storageClass: longhorn
    pvcRetain: false
    pvcSize: 1Gi
podOptions:
  defaultAffinity: false
TZ: Asia/Jerusalem
workload:
  main:
    podSpec:
      annotations:
        secret.reloader.stakater.com/reload: "profilarr-kanidm-oauth2-credentials"
      containers:
        main:
          env:
            AUTH: "on"
            ORIGIN: "https://profilarr.${FQDN_02}"
            OIDC_CLIENT_ID:
              secretKeyRef:
                expandObjectName: false
                name: profilarr-kanidm-oauth2-credentials
                key: CLIENT_ID
            OIDC_CLIENT_SECRET:
              secretKeyRef:
                expandObjectName: false
                name: profilarr-kanidm-oauth2-credentials
                key: CLIENT_SECRET
            OIDC_DISCOVERY_URL: "https://auth.${FQDN_01}/oauth2/openid/profilarr/.well-known/openid-configuration"
ingress:
  main:
    enabled: true
    ingressClassName: tailscale
    annotations:
      gethomepage.dev/description: Arr configuration sync.
      gethomepage.dev/enabled: "true"
      gethomepage.dev/group: Media Automation (Configuration)
      gethomepage.dev/icon: profilarr.svg
      gethomepage.dev/name: Profilarr
      gethomepage.dev/pod-selector: "app.kubernetes.io/instance=profilarr"
      gethomepage.dev/widget.headers.X-Api-Key: "{{`{{HOMEPAGE_VAR_PROFILARR_KEY}}`}}"
      gethomepage.dev/widget.mappings.0.field: "arrs"
      gethomepage.dev/widget.mappings.0.format: "size"
      gethomepage.dev/widget.mappings.0.label: "Arrs"
      gethomepage.dev/widget.mappings.1.field: "databases"
      gethomepage.dev/widget.mappings.1.format: "size"
      gethomepage.dev/widget.mappings.1.label: "Databases"
      gethomepage.dev/widget.type: "customapi"
      gethomepage.dev/widget.url: "http://profilarr.servarr.svc.cluster.local:6868/api/v1/status"
      tailscale.com/proxy-group: ingress-proxies
    hosts:
      - host: "profilarr.${FQDN_02}"
        paths:
          - path: "/"
            pathType: Prefix
    tls:
      - hosts:
          - "profilarr.${FQDN_02}"
persistence:
  config:
    enabled: true
    mountPath: "/config"
