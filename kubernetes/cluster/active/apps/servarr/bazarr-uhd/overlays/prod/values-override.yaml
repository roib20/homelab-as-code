---
global:
  fallbackDefaults:
    storageClass: longhorn
    pvcRetain: false
    pvcSize: 1Gi
podOptions:
  defaultAffinity: false
workload:
  main:
    podSpec:
      annotations:
        secret.reloader.stakater.com/reload: "bazarr-jellyfin-secret,bazarr-provider-secrets,servarr-postgres-app,servarr-secrets"
      containers:
        main:
          env:
            DYNACONF_analytics__enabled: false
            DYNACONF_auth__APIKEY:
              secretKeyRef:
                name: servarr-secrets
                key: bazarr_uhd_api_key
                expandObjectName: false
            DYNACONF_auth__TYPE: "@null"
            DYNACONF_general__debug: false
            DYNACONF_general__enabled_providers: >-
              ["addic7ed", "betaseries", "gestdown", "ktuvit", "opensubtitlescom", "soustitreseu", "subdl",
              "subf2m", "subsource", "subtitlecat", "subtitulamostv", "supersubtitles", "tvsubtitles", "wizdom", "yifysubtitles"]
            DYNACONF_general__hi_extension: sdh
            DYNACONF_general__instance_name: Bazarr UHD
            DYNACONF_general__postprocessing_cmd: >-
              python3 "/config/subcleaner/subcleaner.py"
              "{{`{{subtitles}}`}}"
              --silent
            DYNACONF_general__theme: auto
            DYNACONF_general__use_embedded_subs: true
            DYNACONF_general__use_jellyfin: true
            DYNACONF_general__use_postprocessing: true
            DYNACONF_general__use_radarr: true
            DYNACONF_general__use_sonarr: true
            DYNACONF_general__utf8_encode: true
            DYNACONF_jellyfin__refresh_method: immediate
            DYNACONF_jellyfin__update_movie_library: true
            DYNACONF_jellyfin__update_series_library: true
            DYNACONF_jellyfin__url: http://jellyfin.jellyfin.svc.cluster.local:8096
            DYNACONF_opensubtitlescom__include_ai_translated: false
            DYNACONF_opensubtitlescom__include_machine_translated: false
            DYNACONF_radarr__apikey:
              secretKeyRef:
                name: servarr-secrets
                key: radarr_uhd_api_key
                expandObjectName: false
            DYNACONF_radarr__ip: radarr-uhd.servarr.svc.cluster.local
            DYNACONF_radarr__port: 7878
            DYNACONF_radarr__ssl: false
            DYNACONF_sonarr__apikey:
              secretKeyRef:
                name: servarr-secrets
                key: sonarr_uhd_api_key
                expandObjectName: false
            DYNACONF_sonarr__ip: sonarr-uhd.servarr.svc.cluster.local
            DYNACONF_sonarr__port: 8989
            DYNACONF_sonarr__ssl: false
            DYNACONF_subdl__ai_translate: false
            DYNACONF_subdl__include_ai_translated: false
            DYNACONF_subsync__use_subsync: true
            DYNACONF_subtitlecat__include_machine_translated: false
            POSTGRES_DATABASE: bazarr-uhd
            POSTGRES_ENABLED: true
            POSTGRES_HOST:
              secretKeyRef:
                name: servarr-postgres-app
                key: host
                expandObjectName: false
            POSTGRES_PASSWORD:
              secretKeyRef:
                name: servarr-postgres-app
                key: password
                expandObjectName: false
            POSTGRES_PORT:
              secretKeyRef:
                name: servarr-postgres-app
                key: port
                expandObjectName: false
            POSTGRES_USERNAME:
              secretKeyRef:
                name: servarr-postgres-app
                key: user
                expandObjectName: false
          envFrom:
            - secretRef:
                name: bazarr-jellyfin-secret
                expandObjectName: false
            - secretRef:
                name: bazarr-provider-secrets
                expandObjectName: false
        exportarr:
          env:
            API_KEY:
              secretKeyRef:
                name: servarr-secrets
                key: bazarr_uhd_api_key
                expandObjectName: false
      initContainers:
        subcleaner:
          enabled: true
          type: init
          imageSelector: image
          command:
            - /bin/sh
            - -ec
          args:
            - |
              COMMIT="f2022c522fc580edb7597ef53e17b1ba1801957a"
              if grep -qx "${COMMIT}" "/config/subcleaner/.commit" 2>/dev/null; then
                exit 0
              fi
              mkdir -p "/config/subcleaner"
              curl -fsSL "https://codeload.github.com/KBlixt/subcleaner/tar.gz/${COMMIT}" -o "/tmp/subcleaner.tar.gz"
              echo "c2eb987d9184faa014e620be3b2e57ae5aa6c32419ab8d84f6f9ea9937edfc03  /tmp/subcleaner.tar.gz" | sha256sum -c -
              rm -f "/config/subcleaner/.commit"
              tar -xzf "/tmp/subcleaner.tar.gz" --strip-components=1 -C "/config/subcleaner"
              rm "/tmp/subcleaner.tar.gz"
              cp "/config/subcleaner/default_config/subcleaner.conf" "/config/subcleaner/subcleaner.conf"
              echo "${COMMIT}" > "/config/subcleaner/.commit"
ingress:
  main:
    enabled: true
    ingressClassName: tailscale
    annotations:
      tailscale.com/proxy-group: ingress-proxies
      gethomepage.dev/enabled: "true"
      gethomepage.dev/description: Subtitle downloader (UHD).
      gethomepage.dev/group: Media Automation (Ultra HD Video)
      gethomepage.dev/icon: bazarr.svg
      gethomepage.dev/name: Bazarr UHD
      gethomepage.dev/pod-selector: "app.kubernetes.io/instance=bazarr-uhd"
      gethomepage.dev/widget.type: "bazarr"
      gethomepage.dev/widget.url: "http://bazarr-uhd.servarr.svc.cluster.local:6767"
      gethomepage.dev/widget.key: "{{`{{HOMEPAGE_VAR_BAZARR_UHD_KEY}}`}}"
    hosts:
      - host: "bazarr-uhd.${FQDN_02}"
        paths:
          - path: "/"
            pathType: Prefix
    tls:
      - hosts:
          - "bazarr-uhd.${FQDN_02}"
persistence:
  config:
    enabled: true
    mountPath: "/config"
    targetSelector:
      main:
        main:
          mountPath: /config
        exportarr:
          mountPath: /config
          readOnly: true
        subcleaner:
          mountPath: "/config"
  mediadata:
    enabled: true
    type: pvc
    mountPath: "/MediaData"
    readOnly: false
    existingClaim: smb-mediadata-rwx
metrics:
  main:
    enabled: true
    type: "servicemonitor"
    endpoints:
      - port: metrics
        path: /metrics
    targetSelector: metrics
    prometheusRule:
      enabled: true
