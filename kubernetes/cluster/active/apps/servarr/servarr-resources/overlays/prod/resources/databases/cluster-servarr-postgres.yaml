---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    postgresql.cnpg.homelab.towerofkubes.com/barman-server-name: servarr-postgres
  name: servarr-postgres
spec:
  bootstrap:
    initdb:
      database: servarr
      owner: servarr
  instances: 3
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  managed:
    services:
      disabledDefaultServices:
        - ro
        - r
  storage:
    size: 15Gi
    storageClass: longhorn-cnpg
  resources:
    requests:
      cpu: 65m
      memory: 320Mi
    limits:
      memory: 768Mi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: cnpg-backups
