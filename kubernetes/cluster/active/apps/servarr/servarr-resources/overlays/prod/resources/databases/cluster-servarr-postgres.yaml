---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: servarr-postgres
spec:
  instances: 3
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  bootstrap:
    initdb:
      database: servarr
      owner: servarr
  managed:
    services:
      disabledDefaultServices:
        - ro
        - r
  storage:
    size: 15Gi
    storageClass: longhorn-cnpg
  resources:
    requests:
      cpu: 65m
      memory: 320Mi
    limits:
      memory: 768Mi
