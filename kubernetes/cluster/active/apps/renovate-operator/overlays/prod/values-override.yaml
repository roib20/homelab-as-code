---
ingress:
  enabled: true
  ingressClassName: tailscale
  host: "renovate.${FQDN_02}"
  tls:
    - hosts:
        - "renovate.${FQDN_02}"
  annotations:
    gethomepage.dev/description: Operator managing Renovate jobs for dependency updates.
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Operations
    gethomepage.dev/icon: renovate.svg
    gethomepage.dev/name: Renovate Operator
    gethomepage.dev/pod-selector: "app=renovate-operator"
    gethomepage.dev/widget.metrics.0.format.type: "number"
    gethomepage.dev/widget.metrics.0.label: "Projects"
    gethomepage.dev/widget.metrics.0.query: 'count(count by (renovate_namespace, renovate_job, project) (renovate_operator_run_failed{job="renovate-operator",namespace="renovate"}))'
    gethomepage.dev/widget.type: "prometheusmetric"
    gethomepage.dev/widget.url: "http://vmsingle-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8428"
    tailscale.com/proxy-group: ingress-proxies
webhook:
  enabled: true
  port: 8082
  route:
    enabled: true
    annotations: {}
    labels: {}
    hostnames:
      - "renovate.${FQDN_01}"
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: http-gateway-api
        namespace: envoy-gateway-ingress
auth:
  oidc:
    enabled: true
    issuerUrl: "https://auth.${FQDN_01}/oauth2/openid/renovate-operator"
    clientId: ""
    existingSecret: renovate-operator-kanidm-oauth2-credentials
    secretKey: CLIENT_SECRET
    redirectUrl: "https://renovate.${FQDN_02}/auth/callback"
    additionalScopes:
      - groups
  github:
    enabled: false
podAnnotations:
  secret.reloader.stakater.com/reload: "renovate-operator-kanidm-oauth2-credentials"
