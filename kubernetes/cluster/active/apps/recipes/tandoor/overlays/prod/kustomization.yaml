---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - external-secrets
  - resources/cnpg-cluster.yaml
  - resources/httproute.yaml
components:
  - ../../../../../../../components/cnpg-backup
  - ../../../../../../../components/kopiur-volume
helmCharts:
  - name: tandoor-recipes
    repo: oci://oci.trueforge.org/truecharts
    version: 21.11.0
    releaseName: tandoor-recipes
    namespace: tandoor
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - values-override.yaml
    includeCRDs: true
configMapGenerator:
  - name: env-vars
    envs:
      - /tmp/env-vars.env
  - name: tandoor-oidc
    literals:
      - AUTH_HOST=auth.${FQDN_01}
    options:
      disableNameSuffixHash: true
replacements:
  - path: replacements.yaml
patches:
  - path: patches/chart-secret-cleanup.yaml
  - path: patches/postgres-ca-mount.yaml
  - target:
      kind: ObjectStore
      name: cnpg-backups
    patch: |-
      - op: replace
        path: /spec/configuration/destinationPath
        value: s3://k8s-backups/cnpg/tandoor
  - target:
      kind: ScheduledBackup
      name: cnpg-backup
    patch: |-
      - op: replace
        path: /spec/schedule
        value: "0 0 2 * * *"
  - target:
      kind: SnapshotPolicy
      name: kopiur-snapshot-policy
    patch: |-
      - op: replace
        path: /spec/sources/0/pvcSelector/labelSelector/matchLabels/kopiur.home-operations.com~1policy
        value: tandoor
  - target:
      kind: PersistentVolumeClaim
      name: tandoor-recipes-media
    patch: |-
      - op: add
        path: /metadata/labels/kopiur.home-operations.com~1policy
        value: tandoor
      - op: add
        path: /spec/dataSourceRef
        value:
          apiGroup: kopiur.home-operations.com
          kind: Restore
          name: kopiur-restore
