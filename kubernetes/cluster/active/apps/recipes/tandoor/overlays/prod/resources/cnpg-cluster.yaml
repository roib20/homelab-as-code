---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    postgresql.cnpg.homelab.towerofkubes.com/barman-server-name: tandoor-postgres
  name: tandoor-postgres
spec:
  instances: 2
  primaryUpdateMethod: switchover
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  postgresql:
    pg_hba:
      - hostssl tandoor tandoor all scram-sha-256
      - host tandoor tandoor all reject
  managed:
    services:
      disabledDefaultServices:
        - ro
        - r
  storage:
    size: 1Gi
    storageClass: longhorn-cnpg
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      memory: 512Mi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: cnpg-backups
  bootstrap:
    initdb:
      database: tandoor
      owner: tandoor
