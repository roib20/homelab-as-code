---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - external-secrets
  - database/cloudnative-pg.yaml
  - resources/seerr-settings.yaml
  - resources/httproute-gate-rbac.yaml
  - resources/httproute-gate-job.yaml
  - resources/httproute.yaml
components:
  - ../../../../../../components/cnpg-backup
helmCharts:
  - name: seerr-chart
    repo: oci://ghcr.io/seerr-team/seerr
    version: 3.9.1
    releaseName: seerr
    namespace: seerr
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - values-override.yaml
    includeCRDs: true
configMapGenerator:
  - name: env-vars-seerr
    envs:
      - /tmp/env-vars.env
replacements:
  - path: replacements.yaml
patches:
  - path: patches/statefulset-bootstrap-settings.yaml
  - target:
      kind: ObjectStore
      name: cnpg-backups
    patch: |-
      - op: replace
        path: /spec/configuration/destinationPath
        value: s3://k8s-backups/cnpg/seerr
  - target:
      kind: ScheduledBackup
      name: cnpg-backup
    patch: |-
      - op: replace
        path: /spec/schedule
        value: "0 30 0 * * *"
