---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: seerr-postgres
spec:
  instances: 2
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  bootstrap:
    recovery:
      source: clusterBackup
  externalClusters:
    - name: clusterBackup
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: cnpg-backups
          serverName: seerr-postgres
  managed:
    services:
      disabledDefaultServices:
        - ro
        - r
  storage:
    size: 5Gi
    storageClass: longhorn-cnpg
  resources:
    requests:
      cpu: 60m
      memory: 128Mi
    limits:
      memory: 512Mi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: cnpg-backups
