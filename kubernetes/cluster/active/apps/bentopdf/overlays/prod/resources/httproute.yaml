---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bentopdf
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: PDF Toolkit.
    gethomepage.dev/group: Toolkits
    gethomepage.dev/icon: bentopdf.svg
    gethomepage.dev/name: BentoPDF
    gethomepage.dev/pod-selector: "app.kubernetes.io/instance=bentopdf"
    gethomepage.dev/widget.metrics.0.format.type: "percent"
    gethomepage.dev/widget.metrics.0.label: "CPU"
    gethomepage.dev/widget.metrics.0.query: '100 * sum(max by (pod, container) (rate(container_cpu_usage_seconds_total{namespace="pdf",pod=~"bentopdf-.*",container="app"}[5m])))'
    gethomepage.dev/widget.metrics.1.format.type: "bytes"
    gethomepage.dev/widget.metrics.1.label: "RAM"
    gethomepage.dev/widget.metrics.1.query: 'sum(max by (pod, container) (container_memory_working_set_bytes{namespace="pdf",pod=~"bentopdf-.*",container="app"}))'
    gethomepage.dev/widget.type: "prometheusmetric"
    gethomepage.dev/widget.url: "http://vmsingle-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8428"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: http-gateway-api
      namespace: envoy-gateway-ingress
  hostnames:
    - "pdf.${FQDN_01}"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: bentopdf
          namespace: pdf
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
      # https://github.com/alam00000/bentopdf/blob/main/docs/self-hosting/kubernetes.md#if-youre-using-gateway-api-and-want-to-force-add-headers
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Cross-Origin-Opener-Policy
                value: same-origin
              - name: Cross-Origin-Embedder-Policy
                value: require-corp
