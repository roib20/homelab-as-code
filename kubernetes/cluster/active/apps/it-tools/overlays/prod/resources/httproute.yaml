---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: it-tools
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: Developer utilities.
    gethomepage.dev/group: Toolkits
    gethomepage.dev/icon: it-tools.svg
    gethomepage.dev/name: it-tools
    gethomepage.dev/pod-selector: "app.kubernetes.io/instance=it-tools"
    gethomepage.dev/widget.metrics.0.format.type: "percent"
    gethomepage.dev/widget.metrics.0.label: "CPU"
    gethomepage.dev/widget.metrics.0.query: '100 * sum(max by (pod, container) (rate(container_cpu_usage_seconds_total{namespace="it-tools",pod=~"it-tools-.*",container="it-tools"}[5m])))'
    gethomepage.dev/widget.metrics.1.format.type: "bytes"
    gethomepage.dev/widget.metrics.1.label: "RAM"
    gethomepage.dev/widget.metrics.1.query: 'sum(max by (pod, container) (container_memory_working_set_bytes{namespace="it-tools",pod=~"it-tools-.*",container="it-tools"}))'
    gethomepage.dev/widget.type: "prometheusmetric"
    gethomepage.dev/widget.url: "http://vmsingle-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8428"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: http-gateway-api
      namespace: envoy-gateway-ingress
  hostnames:
    - "it-tools.${FQDN_01}"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: it-tools
          namespace: it-tools
          port: 18082
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
