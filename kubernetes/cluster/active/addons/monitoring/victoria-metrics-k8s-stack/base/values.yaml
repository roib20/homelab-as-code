---
victoria-metrics-operator:
  enabled: false
  crds:
    cleanup:
      enabled: false

grafana:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  sidecar:
    dashboards:
      searchNamespace: ALL

kube-state-metrics:
  rbac:
    extraRules:
      - apiGroups: [kaniop.rs]
        resources: [kanidmgroups, kanidmoauth2clients, kanidmpersonaccounts]
        verbs: [list, watch]
  customResourceState:
    enabled: true
    config:
      kind: CustomResourceStateMetrics
      spec:
        resources:
          - groupVersionKind:
              group: kaniop.rs
              version: v1beta1
              kind: KanidmGroup
            metricNamePrefix: kube_kanidm
            metrics:
              - name: group_info
                help: Kaniop-managed Kanidm groups.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                      resource_namespace: [metadata, namespace]
                      kanidm: [spec, kanidmRef, name]
                      kanidm_namespace: [spec, kanidmRef, namespace]
          - groupVersionKind:
              group: kaniop.rs
              version: v1beta1
              kind: KanidmOAuth2Client
            metricNamePrefix: kube_kanidm
            metrics:
              - name: oauth2client_info
                help: Kaniop-managed Kanidm OAuth2 clients.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                      resource_namespace: [metadata, namespace]
                      kanidm: [spec, kanidmRef, name]
                      kanidm_namespace: [spec, kanidmRef, namespace]
          - groupVersionKind:
              group: kaniop.rs
              version: v1beta1
              kind: KanidmPersonAccount
            metricNamePrefix: kube_kanidm
            metrics:
              - name: personaccount_info
                help: Kaniop-managed Kanidm users.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                      resource_namespace: [metadata, namespace]
                      kanidm: [spec, kanidmRef, name]
                      kanidm_namespace: [spec, kanidmRef, namespace]
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

# Drop extra node labels added by Talos, NFD and device plugins.
kubelet:
  vmScrape:
    spec:
      relabelConfigs:
        - sourceLabels:
            - __meta_kubernetes_node_name
          targetLabel: node
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)
        - action: labeldrop
          regex: (extensions_talos_dev_.+|feature_node_kubernetes_io_.+|gpu_intel_com_.+|intel_feature_node_kubernetes_io_.+)
        - sourceLabels: [__metrics_path__]
          targetLabel: metrics_path
        - replacement: kubelet
          targetLabel: job

vmsingle:
  spec:
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        memory: 2Gi
