---
victoria-metrics-operator:
  enabled: false
  crds:
    cleanup:
      enabled: false

grafana:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  sidecar:
    dashboards:
      searchNamespace: ALL

kube-state-metrics:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

# Drop extra node labels added by Talos, NFD and device plugins.
kubelet:
  vmScrape:
    spec:
      relabelConfigs:
        - sourceLabels:
            - __meta_kubernetes_node_name
          targetLabel: node
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)
        - action: labeldrop
          regex: (extensions_talos_dev_.+|feature_node_kubernetes_io_.+|gpu_intel_com_.+|intel_feature_node_kubernetes_io_.+)
        - sourceLabels: [__metrics_path__]
          targetLabel: metrics_path
        - replacement: kubelet
          targetLabel: job

vmsingle:
  spec:
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        memory: 2Gi
