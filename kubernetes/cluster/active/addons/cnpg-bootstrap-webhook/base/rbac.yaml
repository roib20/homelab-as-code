---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnpg-bootstrap-webhook
  namespace: cnpg-bootstrap-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cnpg-bootstrap-webhook
rules:
  - apiGroups: [barmancloud.cnpg.io]
    resources: [objectstores]
    verbs: [get]
  - apiGroups: ['']
    resources: [secrets]
    resourceNames: [cnpg-backup-secret]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cnpg-bootstrap-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cnpg-bootstrap-webhook
subjects:
  - kind: ServiceAccount
    name: cnpg-bootstrap-webhook
    namespace: cnpg-bootstrap-system
