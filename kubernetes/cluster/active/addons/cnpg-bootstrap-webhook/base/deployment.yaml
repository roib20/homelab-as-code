---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnpg-bootstrap-webhook
  namespace: cnpg-bootstrap-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cnpg-bootstrap-webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cnpg-bootstrap-webhook
    spec:
      serviceAccountName: cnpg-bootstrap-webhook
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webhook
          # renovate: datasource=docker depName=cloudnative-pg/plugin-barman-cloud-sidecar
          image: ghcr.io/cloudnative-pg/plugin-barman-cloud-sidecar:v0.15.0
          command: [python3, /webhook/webhook.py]
          ports:
            - name: https
              containerPort: 8443
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: webhook
              mountPath: /webhook
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: webhook
          configMap:
            name: cnpg-bootstrap-webhook
        - name: tls
          secret:
            secretName: cnpg-bootstrap-webhook
