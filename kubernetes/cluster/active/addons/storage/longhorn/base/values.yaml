---
defaultSettings:
  defaultDataLocality: best-effort
  defaultDataPath: "/var/mnt/longhorn"
  defaultReplicaCount: '{"v1":"2","v2":"2"}'
  nodeDrainPolicy: block-for-eviction-if-contains-last-replica
  detachManuallyAttachedVolumesWhenCordoned: true
  orphanResourceAutoDeletion: instance;replica-data
  storageOverProvisioningPercentage: 1000
  systemManagedCSIComponentsResourceLimits: >-
    {"csi-attacher":{"requests":{"cpu":"10m","memory":"64Mi"}},
    "csi-provisioner":{"requests":{"cpu":"10m","memory":"64Mi"}},
    "csi-resizer":{"requests":{"cpu":"10m","memory":"64Mi"}},
    "csi-snapshotter":{"requests":{"cpu":"10m","memory":"64Mi"}},
    "longhorn-csi-plugin":{"requests":{"cpu":"50m","memory":"128Mi"}},
    "longhorn-liveness-probe":{"requests":{"cpu":"10m","memory":"32Mi"}},
    "node-driver-registrar":{"requests":{"cpu":"10m","memory":"32Mi"}}}
longhornManager:
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
persistence:
  defaultClassReplicaCount: 2
  defaultDataLocality: best-effort
preUpgradeChecker:
  # -- Setting that allows Longhorn to perform pre-upgrade checks. Disable this setting when installing Longhorn using Argo CD or other GitOps solutions.
  jobEnabled: false
metrics:
  serviceMonitor:
    enabled: true
    additionalLabels:
      release: kube-prometheus-stack
