---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: istiod
    repo: oci://ghcr.io/istio/release/charts
    version: 1.31.0
    releaseName: istiod
    namespace: istio-system
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - values-override.yaml
    includeCRDs: true
resources:
  - ../../base
